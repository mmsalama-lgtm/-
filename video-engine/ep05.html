<script>
const NAVY='#1F3A5F', GOLD='#F5B400', RED='#B23A3A', BURG='#6E0F2A', INK='#1F3A5F';
const FPS=30, DURATION=56.0;
const svg=document.getElementById('svg'), defs=document.getElementById('defs'), world=document.getElementById('world');
const NS='http://www.w3.org/2000/svg';
const gen=rough.generator();
let SEED=7;
function ro(o){return Object.assign({roughness:1.1,bowing:0.9,stroke:NAVY,strokeWidth:5,seed:SEED++,fillWeight:3.2,hachureGap:11},o||{})}
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||world).appendChild(e);return e}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeOut=p=>1-Math.pow(1-p,3);
const easeOutBack=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};

// ---- voice timeline: original-recording seconds -> edited seconds (long pauses were tightened)
const CUTS=[[2.02, 2.4], [4.075, 4.435], [6.015, 6.345], [8.22, 8.93], [12.78, 13.61], [14.99, 15.39], [17.6, 18.54], [20.87, 21.48], [22.84, 23.48], [26.25, 27.15], [30.75, 31.58], [35.74, 36.65], [40.99, 41.61], [44.84, 45.25], [47.0, 47.41], [54.51, 55.0], [56.12, 56.71], [58.28, 59.36], [61.585, 62.035], [63.34, 64.04], [65.435, 65.745]];
function T(o){let s=0;for(const [a,b] of CUTS){if(o>=b)s+=(b-a)+0.03;else if(o>a)return a-s;}return o-s}

const scenes=[], draws=[], updaters=[], events=[];
function scene(t0,t1,out){const g=mk('g',{},world);scenes.push({g,t0,t1,out:out||'slide'});if(isFinite(t1))events.push([t1,t1+0.45,out==='fade'?'soft':'whoosh']);return g}

// ---- animated rough drawing ------------------------------------------------
function rp(parent,drawable,t0,dur,o={}){
  const g=mk('g',o.attrs||{},parent);const parts=[];
  for(const set of drawable.sets){
    const d=gen.opsToPath(set);const op=drawable.options;
    if(set.type==='fillPath'){const p=mk('path',{d,fill:op.fill,stroke:'none'},g);p.style.opacity=0;parts.push({p,fade:true,w:0.15});}
    else{const isFill=set.type==='fillSketch';
      const p=mk('path',{d,fill:'none',stroke:isFill?op.fill:op.stroke,'stroke-width':isFill?op.fillWeight:op.strokeWidth,'stroke-linecap':'round','stroke-linejoin':'round'},g);
      if(o.dash&&!isFill)p.setAttribute('data-dash',o.dash);
      parts.push({p,fill:isFill});}
  }
  return animParts(parts,t0,dur,o);
}
function animParts(parts,t0,dur,o={}){
  let tot=0;
  for(const q of parts){ if(q.fade){q.L=0;q.wl=0;continue}
    q.L=q.p.getTotalLength()||1; q.wl=q.L*(q.fill?(o.fillW??0.35):1); tot+=q.wl;
    if(!q.p.getAttribute('data-dash')){q.p.style.strokeDasharray=q.L+' '+(q.L+5);q.p.style.strokeDashoffset=q.L;}
  }
  const nf=parts.filter(q=>q.fade).length; const fadeShare=nf?0.15:0;
  let acc=0;for(const q of parts){if(q.fade)continue;q.a=acc/tot*(1-fadeShare);acc+=q.wl;q.b=acc/tot*(1-fadeShare);}
  const it={t0,t1:t0+dur,parts,
    upd(t){const p=clamp((t-t0)/dur);for(const q of parts){
      if(q.fade){q.p.style.opacity=clamp((p-(1-fadeShare))/Math.max(fadeShare,1e-3));continue}
      const lp=clamp((p-q.a)/(q.b-q.a));
      q.p.style.strokeDashoffset=q.L*(1-lp);}},
    pt(p){const pp=p*(1-fadeShare);let q=parts.find(q=>!q.fade&&pp>=q.a&&pp<=q.b)||parts.filter(q=>!q.fade).slice(-1)[0];
      const lp=clamp((pp-q.a)/(q.b-q.a));const P=q.p.getPointAtLength(q.L*lp).matrixTransform(q.p.getCTM());return {x:P.x,y:P.y}}};
  if(!o.noHand)draws.push(it); else updaters.push(t=>it.upd(t));
  events.push([t0,t0+dur,o.noHand?'none':'draw']);
  return it;
}
// dashed paths: reveal via mask-like clip by drawing a solid copy into a mask
function dashed(parent,d,t0,dur,o={}){
  const id='m'+(SEED++);const mask=mk('mask',{id,maskUnits:'userSpaceOnUse',x:-2000,y:-2000,width:6000,height:6000},defs);
  const mp=mk('path',{d,fill:'none',stroke:'#fff','stroke-width':(o.sw||8)+14,'stroke-linecap':'round'},mask);
  const vis=mk('path',{d,fill:'none',stroke:o.color||GOLD,'stroke-width':o.sw||8,'stroke-linecap':'round','stroke-dasharray':o.dash||'22 18',mask:`url(#${id})`},parent);
  const L=mp.getTotalLength();mp.style.strokeDasharray=L+' '+(L+5);mp.style.strokeDashoffset=L;
  const it={t0,t1:t0+dur,upd(t){const p=clamp((t-t0)/dur);mp.style.strokeDashoffset=L*(1-p)},
    pt(p){const P=vis.getPointAtLength(L*p).matrixTransform(vis.getCTM());return{x:P.x,y:P.y}}};
  draws.push(it);events.push([t0,t0+dur,'draw']);return it;
}
// simple hand-drawn line helpers
const R={
  line:(g,x1,y1,x2,y2,t0,dur,o)=>rp(g,gen.line(x1,y1,x2,y2,ro(o)),t0,dur,o),
  rect:(g,x,y,w,h,t0,dur,o)=>rp(g,gen.rectangle(x,y,w,h,ro(o)),t0,dur,o),
  circle:(g,x,y,d,t0,dur,o)=>rp(g,gen.circle(x,y,d,ro(o)),t0,dur,o),
  ellipse:(g,x,y,w,h,t0,dur,o)=>rp(g,gen.ellipse(x,y,w,h,ro(o)),t0,dur,o),
  path:(g,d,t0,dur,o)=>rp(g,gen.path(d,ro(o)),t0,dur,o),
  poly:(g,pts,t0,dur,o)=>rp(g,gen.polygon(pts,ro(o)),t0,dur,o),
  lines:(g,pts,t0,dur,o)=>rp(g,gen.linearPath(pts,ro(o)),t0,dur,o),
};

// ---- handwritten text (revealed right-to-left for Arabic) ------------------
const texts=[];
function wtext(parent,str,x,y,o={}){
  const fam={ruqaa:"'Ruqaa'",cairo:"'Cairo'",caveat:"'Caveat'"}[o.font||'ruqaa'];
  const a={x,y,'font-family':fam,'font-weight':o.weight||700,'font-size':o.size||64,fill:o.color||NAVY,'text-anchor':o.anchor||'middle',direction:o.ltr?'ltr':'rtl'};
  if(o.stroke){a.stroke=o.stroke;a['stroke-width']=o.sw||2.5;a['paint-order']='stroke';a['stroke-linejoin']='round'}
  if(o.opacity)a.opacity=o.opacity;
  const t=mk('text',a,parent);
  if(o.spans){for(const [s,c] of o.spans){const sp=mk('tspan',{fill:c},t);sp.textContent=s}} else t.textContent=str;
  const id='c'+(SEED++);const cp=mk('clipPath',{id},defs);const r=mk('rect',{x:0,y:0,width:0,height:0},cp);
  t.setAttribute('clip-path',`url(#${id})`);
  const it={t0:o.t0,t1:o.t0+o.dur,el:t,init(){this.bb=t.getBBox()},
    upd(tt){const bb=this.bb,p=easeIn2(clamp((tt-o.t0)/o.dur));const w=bb.width*p;
      r.setAttribute('y',bb.y-60);r.setAttribute('height',bb.height+120);
      if(o.ltr){r.setAttribute('x',bb.x-40);r.setAttribute('width',w+40)}else{r.setAttribute('x',bb.x+bb.width-w);r.setAttribute('width',w+60)}},
    pt(p){p=easeIn2(p);const bb=this.bb;const x=o.ltr?bb.x+bb.width*p:bb.x+bb.width*(1-p);
      const y=bb.y+bb.height*0.66+Math.sin(p*bb.width/9)*bb.height*0.16;
      const P=svg.createSVGPoint();P.x=x;P.y=y;return P.matrixTransform(t.getCTM())}};
  texts.push(it);if(o.noHand)updaters.push(tt=>it.upd(tt));else draws.push(it);events.push([o.t0,o.t0+o.dur,o.noHand?'none':'draw']);
  return it;
}
function easeIn2(p){return p}
function pop(el,t0,dur=0.4,o={}){el.classList.add('pop');el.style.opacity=0;events.push([t0,t0+dur,'pop']);
  updaters.push(t=>{const p=clamp((t-t0)/dur);el.style.opacity=p>0?1:0;el.style.transform=`scale(${p<=0?0.001:easeOutBack(p)})`})}
function fade(el,t0,dur=0.3,to=1){el.style.opacity=0;updaters.push(t=>{el.style.opacity=to*clamp((t-t0)/dur)})}
function fadeOut(el,t0,dur=0.25){updaters.push(t=>{if(t>=t0)el.style.opacity=Math.min(+el.style.opacity||1,1-clamp((t-t0)/dur))})}

// ---- reusable icons ----------------------------------------------------------
function sparkle(g,x,y,s,t0,color){const W=mk('g',{},g);s*=1.7;const G=mk('g',{transform:`translate(${x},${y}) scale(${s})`},W);
  const d='M0 -30 Q5 -5 30 0 Q5 5 0 30 Q-5 5 -30 0 Q-5 -5 0 -30Z';mk('path',{d,fill:color||GOLD,stroke:NAVY,'stroke-width':2.5/s,'stroke-linejoin':'round'},G);pop(W,t0,0.35);return W}
function check(g,x,y,s,t0,dur,color){return R.path(g,`M${x-30*s} ${y} L${x-8*s} ${y+24*s} L${x+34*s} ${y-30*s}`,t0,dur,{stroke:color||GOLD,strokeWidth:11*Math.min(1.2,s),roughness:0.6})}
// stick figure with tie: feet at (x,y), height h
function figure(g,x,y,h,o={}){
  const G=mk('g',{transform:`translate(${x},${y}) scale(${h/200})`},g);const sw=o.sw||6;
  const parts=[];const add=(dr)=>{for(const set of dr.sets){const p=mk('path',{d:gen.opsToPath(set),fill:set.type==='fillPath'?dr.options.fill:'none',stroke:set.type==='fillPath'?'none':(set.type==='fillSketch'?dr.options.fill:dr.options.stroke),'stroke-width':set.type==='fillSketch'?dr.options.fillWeight:sw,'stroke-linecap':'round','stroke-linejoin':'round'},G);parts.push({p,fill:set.type==='fillSketch',fade:set.type==='fillPath'})}};
  const c=o.color||NAVY;
  add(gen.circle(0,-170,52,ro({stroke:c,strokeWidth:sw,fill:'#fff',fillStyle:'solid',roughness:0.8})));
  add(gen.line(0,-144,0,-70,ro({stroke:c,strokeWidth:sw,roughness:0.6})));
  const arms=o.arms||'down';
  if(arms==='down'){add(gen.linearPath([[-34,-80],[0,-128],[34,-80]],ro({stroke:c,strokeWidth:sw,roughness:0.6})))}
  else if(arms==='up'){add(gen.linearPath([[-36,-170],[0,-128],[36,-170]],ro({stroke:c,strokeWidth:sw,roughness:0.6})))}
  else if(arms==='point'){add(gen.linearPath([[-30,-84],[0,-128],[44,-150]],ro({stroke:c,strokeWidth:sw,roughness:0.6})))}
  else if(arms==='hips'){add(gen.linearPath([[-14,-82],[-30,-104],[0,-128],[30,-104],[14,-82]],ro({stroke:c,strokeWidth:sw,roughness:0.6})))}
  add(gen.linearPath([[-26,0],[0,-70],[26,0]],ro({stroke:c,strokeWidth:sw,roughness:0.6})));
  const tie=mk('path',{d:'M-6 -142 L6 -142 L4 -132 L9 -100 L0 -90 L-9 -100 L-4 -132 Z',fill:o.tie||BURG,stroke:'none'},G);
  if(o.face!==false){mk('circle',{cx:-8,cy:-174,r:3.2,fill:c},G);mk('circle',{cx:9,cy:-174,r:3.2,fill:c},G);
    mk('path',{d:o.sad?'M-9 -154 Q0 -161 9 -154':'M-10 -160 Q0 -150 10 -160',fill:'none',stroke:c,'stroke-width':3,'stroke-linecap':'round'},G)}
  return {G,parts};
}
function drawFigure(g,x,y,h,t0,dur,o={}){const f=figure(g,x,y,h,o);const tie=f.G.querySelector('path[fill="'+(o.tie||BURG)+'"]');
  const eyes=[...f.G.querySelectorAll('circle'),...f.G.querySelectorAll('path[stroke-width="3"]'),tie];eyes.forEach(e=>e&&fade(e,t0+dur*0.85,0.15));animParts(f.parts,t0,dur,o);return f}
function popFigure(g,x,y,h,t0,o={}){const W=mk('g',{},g);const f=figure(W,x,y,h,o);pop(W,t0,0.35);return f}

// ---- logo --------------------------------------------------------------------
const logo=document.getElementById('logo');const logoG=document.getElementById('logoG');
function placeLogo(cx,cy,d,s=1,op=1){const k=d/1060*s;logo.setAttribute('transform',`translate(${cx-540*k},${cy-540*k}) scale(${k})`);logoG.style.opacity=op}
const L_C={x:960,y:500,d:540}, L_K={x:1920-50-70,y:50+70,d:140}, L_E={x:960,y:350,d:400};
const tCloseLogo=T(64.39)-0.35;
function logoAt(t){
  if(t<0.72){placeLogo(L_C.x,L_C.y,L_C.d,1,0);return}
  if(t<1.02){const p=easeOut((t-0.72)/0.3);placeLogo(L_C.x,L_C.y,L_C.d,1.15-0.15*p,clamp((t-0.72)/0.08));return}
  if(t<2.3){placeLogo(L_C.x,L_C.y,L_C.d);return}
  const lerp=(A,B,p)=>({x:A.x+(B.x-A.x)*p,y:A.y+(B.y-A.y)*p,d:A.d+(B.d-A.d)*p});
  if(t<2.85){const q=lerp(L_C,L_K,ease((t-2.3)/0.55));placeLogo(q.x,q.y,q.d);return}
  if(t<tCloseLogo){placeLogo(L_K.x,L_K.y,L_K.d);return}
  if(t<tCloseLogo+0.65){const q=lerp(L_K,L_E,ease((t-tCloseLogo)/0.65));placeLogo(q.x,q.y,q.d);return}
  placeLogo(L_E.x,L_E.y,L_E.d);
}
events.push([0.72,1.0,'stamp']);events.push([2.3,2.85,'soft']);events.push([tCloseLogo,tCloseLogo+0.6,'whoosh']);

{const t=mk('text',{x:960,y:1056,'text-anchor':'middle','font-family':"'Cairo'",'font-weight':700,'font-size':24,fill:NAVY,opacity:0.85,direction:'ltr','letter-spacing':3},document.getElementById('ui'));t.textContent='EP 05 / 30'}
const PBt=mk('rect',{x:0,y:1074,width:1920,height:6,fill:NAVY,'fill-opacity':0.08},document.getElementById('ui'));const PB=mk('rect',{x:1920,y:1074,width:0,height:6,fill:GOLD},document.getElementById('ui'));

// ---- captions (what is actually spoken, Egyptian Arabic) -----------------------
const CAPS=[[0.72, 1.67, "مساء التميّز…"], [3.13, 3.8, "اختبر نفسك:"], [4.71, 5.62, "قدّامك تلات حاجات…"], [6.62, 7.92, "رسالة واتساب من جروب الشغل"], [9.23, 10.74, "شكوى عميل لازم تتحل النهارده"], [11.41, 12.43, "وخطة الشهر الجاي"], [13.96, 14.49, "تبدأ بإيه؟"], [15.89, 17.25, "أغلبنا… بيرد على الواتساب الأول!"], [19.01, 20.62, "هنا بتيجي مصفوفة أيزنهاور"], [21.73, 22.54, "Eisenhower Matrix"], [23.78, 24.34, "سؤالين بس…"], [24.85, 25.15, "مهم؟"], [25.5, 25.9, "وعاجل؟"], [27.5, 28.27, "مهم وعاجل:"], [28.63, 29.16, "اعمله دلوقتي…"], [29.68, 30.45, "زي الشكوى"], [31.89, 32.83, "مهم ومش عاجل:"], [33.28, 33.69, "خطّطله…"], [34.47, 35.44, "زي الخطة"], [36.95, 37.92, "عاجل ومش مهم:"], [38.45, 38.79, "فوّضه…"], [39.16, 40.69, "زي أغلب الواتساب"], [41.91, 43.1, "لا مهم ولا عاجل:"], [43.78, 44.38, "شيله من يومك"], [45.55, 46.75, "وستيفن كوفي بيقول:"], [47.66, 48.9, "الناس الأكثر فعالية"], [49.55, 51.76, "بيقضّوا وقتهم في المربع التاني:"], [52.57, 54.12, "المهم… اللي مش عاجل"], [55.25, 55.82, "افتكرها كده:"], [57.01, 57.93, "مش كل عاجل… مهم."], [59.71, 61.31, "وإنت؟ يومك بيروح في أنهي مربع؟"], [62.31, 62.99, "اكتبلي في التعليقات"], [64.39, 65.16, "نتقابل بكرة…"], [66.02, 66.78, "في مساء التميّز"]].map(([a,b,s])=>[T(a),T(b),s]);
window.CAPS=CAPS;
const capG=document.getElementById('caps');
const capEls=CAPS.map(([a,b,s],i)=>{
  const g=mk('g',{opacity:0},capG);const rect=mk('rect',{rx:40,ry:40,fill:NAVY,'fill-opacity':0.94,filter:'url(#capsh)'},g);
  const t=mk('text',{x:960,y:992,'text-anchor':'middle',direction:'rtl','font-family':"'Cairo'",'font-weight':800,'font-size':42,fill:'#fff'},g);
  const ws=s.split(' '),tot=ws.reduce((n,w)=>n+w.length+1,0);let acc=0;const sps=[];
  for(const w of ws){const sp=mk('tspan',{fill:'#fff'},t);sp.textContent=w+' ';const f0=acc/tot;acc+=w.length+1;sps.push([sp,f0,acc/tot])}
  const next=CAPS[i+1]?CAPS[i+1][0]:1e9;const end=Math.min(b+0.45,next-0.02);
  return {g,rect,t,a:a-0.08,end,sa:a,sb:b,sps}});
function capsInit(){for(const c of capEls){const bb=c.t.getBBox();c.rect.setAttribute('x',bb.x-38);c.rect.setAttribute('y',bb.y-8);c.rect.setAttribute('width',bb.width+76);c.rect.setAttribute('height',bb.height+16)}}
function capsAt(t){for(const c of capEls){const vis=t>=c.a&&t<c.end;if(!vis){c.g.setAttribute('opacity',0);continue}
  const p=clamp((t-c.a)/0.14),q=clamp((c.end-t)/0.12);c.g.setAttribute('opacity',Math.min(p,q));c.g.setAttribute('transform',`translate(0,${(1-easeOut(p))*14})`);
  const k=clamp((t-c.sa)/Math.max(0.2,c.sb-c.sa));for(const [sp,f0,f1] of c.sps){if(k>=f1){sp.setAttribute('fill','#fff');sp.setAttribute('fill-opacity',1)}else if(k>=f0){sp.setAttribute('fill',GOLD);sp.setAttribute('fill-opacity',1)}else{sp.setAttribute('fill','#fff');sp.setAttribute('fill-opacity',0.5)}}}}

function handAt(t){
  // inside a draw?
  let cur=null,prev=null,next=null;
  for(const d of draws){if(t>=d.t0&&t<=d.t1){cur=d;break}}
  if(cur){const p=clamp((t-cur.t0)/(cur.t1-cur.t0));return cur.pt(p)}
  for(const d of draws){if(d.t1<t&&(!prev||d.t1>prev.t1))prev=d;if(d.t0>t&&(!next||d.t0<next.t0))next=d}
  const pe=prev?prev.pt(1):OFF, ps=next?next.pt(0):OFF;
  const gap=(next?next.t0:1e9)-(prev?prev.t1:-1e9);
  if(prev&&next&&gap<0.75){const p=ease((t-prev.t1)/gap);return {x:pe.x+(ps.x-pe.x)*p,y:pe.y+(ps.y-pe.y)*p-Math.sin(p*Math.PI)*30}}
  const ex=0.4;
  if(prev&&t-prev.t1<ex){const p=ease((t-prev.t1)/ex);return {x:pe.x+(OFF.x-pe.x)*p,y:pe.y+(OFF.y-pe.y)*p}}
  if(next&&next.t0-t<ex){const p=ease(1-(next.t0-t)/ex);return {x:OFF.x+(ps.x-OFF.x)*p,y:OFF.y+(ps.y-OFF.y)*p}}
  return OFF;
}
