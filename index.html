through an approved design change request.", "how": ["Keep a design change log.", "Review the impact.", "Approve before implementation."], "ev": ["Design change log"], "tip": ""}}, {"n": "8.4.1", "s": "upd", "ar": {"t": "ضبط ما يُورَّد خارجياً: عام", "req": "تأكد من مطابقة ما يُورَّد خارجياً. حدِّد الضوابط عندما تُدمج المنتجات في منتجاتك، أو تُقدَّم مباشرة للعميل نيابة عنك، أو تُسنَد عملية كلياً أو جزئياً. ضع وطبّق معايير التقييم والاختيار ورصد الأداء وإعادة التقييم، ووثّق ذلك والإجراءات الناتجة.", "ex": "تقيّم شركة الأفق مورد الكابلات قبل اعتماده (شهادات، زيارة مصنع)، ثم تقيّم أداءه كل ربع سنة. المورد الذي ينخفض أداؤه يوضع تحت المراقبة مع خطة تحسين.", "how": ["معايير اعتماد مكتوبة.", "قائمة موردين معتمدين.", "بطاقة أداء دورية.", "إجراءات للموردين ضعيفي الأداء."], "ev": ["قائمة الموردين المعتمدين", "نماذج التقييم", "بطاقات الأداء"], "tip": ""}, "en": {"t": "Control of externally provided processes, products and services: general", "req": "Ensure externally provided processes, products and services conform to requirements. Determine the controls when the items are incorporated into your own products, are provided directly to your customer on your behalf, or when a process is provided by an external provider. Determine and apply criteria for evaluation, selection, monitoring of performance and re-evaluation, and retain documented information on these activities and any resulting actions.", "ex": "Al-Ufuq Electrical evaluates a cable supplier before approval (certificates, factory visit), then scores performance quarterly. A supplier whose score drops is placed under monitoring with an improvement plan.", "how": ["Write approval criteria.", "Maintain an approved supplier list.", "Issue a periodic scorecard.", "Define actions for underperforming suppliers."], "ev": ["Approved supplier list", "Evaluation forms", "Performance scorecards"], "tip": ""}}, {"n": "8.4.2", "s": "", "ar": {"t": "نوع ومدى الضبط", "req": "تأكد ألا يؤثر ما يُورَّد سلباً على قدرتك. أبقِ العمليات المسندة تحت سيطرة نظامك، وحدِّد الضوابط على المورد وعلى مخرجاته، مع مراعاة الأثر المحتمل وفعالية ضوابط المورد، وحدِّد أنشطة التحقق اللازمة.", "ex": "تحضر شركة الأفق اختبارات المحولات في المصنع قبل الشحن، ويعمل المقاول الباطن للحفر وفق إجراءاتها ويخضع لتفتيشها.", "how": ["تحديد الضوابط حسب أهمية المورد.", "فحص استلام أو فحص في المصنع.", "تدقيقات الموردين."], "ev": ["خطط فحص الاستلام", "تقارير تدقيق الموردين"], "tip": ""}, "en": {"t": "Type and extent of control", "req": "Ensure externally provided items do not adversely affect your ability to deliver conforming products. Keep outsourced processes within the control of your QMS, define the controls applied to the provider and to the resulting output, take into account the potential impact and the effectiveness of the provider's own controls, and determine the verification needed.", "ex": "Al-Ufuq Electrical witnesses factory acceptance tests for transformers before shipment, and the excavation subcontractor works to the company's procedures under its inspection.", "how": ["Set controls in proportion to the supplier's criticality.", "Carry out incoming or factory inspection.", "Audit suppliers."], "ev": ["Incoming inspection plans", "Supplier audit reports"], "tip": ""}}, {"n": "8.4.3", "s": "", "ar": {"t": "المعلومات المقدمة للموردين", "req": "تحقق من كفاية المتطلبات قبل إبلاغها، ثم أبلغ المورد بـ: المطلوب توريده، والاعتمادات، والكفاءة والمؤهلات، والتفاعلات، وضوابط رصد الأداء، وأنشطة التحقق في موقعه.", "ex": "أمر الشراء لدى شركة الأفق يتضمن المواصفة، وشهادات الاختبار المطلوبة، وحضور الاختبار في المصنع، ومؤهلات فنيي التركيب.", "how": ["مراجعة أمر الشراء قبل الإصدار.", "مرفقات فنية واضحة."], "ev": ["أوامر الشراء", "المواصفات المرفقة"], "tip": ""}, "en": {"t": "Information for external providers", "req": "Ensure the adequacy of requirements before communicating them, then communicate to the provider what is to be provided, the approvals required, competence including qualifications, the provider's interactions with you and your customers, the monitoring of performance you will apply, and any verification or validation at the provider's premises.", "ex": "Al-Ufuq Electrical's purchase orders include the specification, the test certificates required, attendance at factory testing, and the qualifications of installation technicians.", "how": ["Review the purchase order before release.", "Attach clear technical requirements."], "ev": ["Purchase orders", "Attached specifications"], "tip": ""}}, {"n": "8.5.1", "s": "", "ar": {"t": "ضبط الإنتاج وتقديم الخدمة", "req": "نفّذ العمل تحت ظروف مضبوطة تشمل حسب الاقتضاء: معلومات موثقة عن الخصائص والأنشطة والنتائج، وموارد رصد مناسبة، ورصداً في المراحل الملائمة، وبنية وبيئة مناسبة، وأشخاصاً أكفاء، ومصادقة دورية للعمليات التي لا يمكن التحقق من مخرجاتها لاحقاً، وإجراءات لمنع الخطأ البشري، وأنشطة الإفراج والتسليم وما بعده.", "ex": "لدى شركة الأفق تعليمات عمل لتركيب وصلات الكابلات، وفحص عند نقاط الوقوف، وفنيون معتمدون. ولحام التأريض الحراري يخضع للمصادقة لأن جودته لا تُكتشف بالكامل لاحقاً. وتستخدم قوائم تحقق لمنع الخطأ البشري.", "how": ["تعليمات عمل للأنشطة الحرجة.", "نقاط فحص ضمن خطة الفحص.", "مصادقة العمليات الخاصة.", "أدوات منع الخطأ مثل قوائم التحقق."], "ev": ["تعليمات العمل", "سجلات الفحص", "سجلات المصادقة"], "tip": ""}, "en": {"t": "Control of production and service provision", "req": "Implement production and service provision under controlled conditions, including as applicable: documented information defining characteristics, activities and results; suitable monitoring and measuring resources; monitoring at appropriate stages; suitable infrastructure and environment; competent persons including required qualifications; validation and periodic revalidation of processes whose output cannot be verified later; actions to prevent human error; and release, delivery and post-delivery activities.", "ex": "Al-Ufuq Electrical has work instructions for cable jointing, inspections at hold points, and certified jointers. Exothermic earthing welds are validated because their quality cannot be fully verified afterwards, and checklists are used to prevent human error.", "how": ["Issue work instructions for critical activities.", "Set inspection points in the ITP.", "Validate special processes.", "Use error-proofing tools such as checklists."], "ev": ["Work instructions", "Inspection records", "Validation records"], "tip": ""}}, {"n": "8.5.2", "s": "", "ar": {"t": "التعريف والتتبع", "req": "عرِّف المخرجات عند الحاجة، وعرِّف حالتها بالنسبة للفحص، واضبط التعريف الفريد عند اشتراط التتبع، ووفّر المعلومات اللازمة للتتبع.", "ex": "كل بكرة كابل لدى شركة الأفق مرقمة ومرتبطة بشهادة المصنع وبموقع التركيب.", "how": ["نظام ترقيم.", "بطاقات حالة الفحص.", "سجل تتبع."], "ev": ["سجلات التتبع", "بطاقات الحالة"], "tip": ""}, "en": {"t": "Identification and traceability", "req": "Use suitable means to identify outputs where necessary, identify their status with respect to monitoring and measurement, control unique identification where traceability is a requirement, and retain the documented information needed to enable traceability.", "ex": "Every cable drum at Al-Ufuq Electrical is numbered and linked to its factory certificate and installed location.", "how": ["Use a numbering system.", "Apply inspection status tags.", "Maintain a traceability record."], "ev": ["Traceability records", "Status tags"], "tip": ""}}, {"n": "8.5.3", "s": "upd", "ar": {"t": "ممتلكات العملاء والموردين", "req": "اعتنِ بممتلكات العملاء والموردين الخارجيين أثناء وجودها لديك: عرِّفها وتحقق منها واحمِها. قد تشمل مواد، وأدوات، ومواقع، وملكية فكرية، وبيانات شخصية. وعند فقدها أو تلفها أبلغ المالك ووثّق ما حدث.", "ex": "المواد المسلمة من العميل تُسجل وتُفحص وتُخزن بشكل منفصل لدى شركة الأفق، ومخططات العميل تُعامل كملكية فكرية، وبيانات المشتركين محمية.", "how": ["سجل ممتلكات الغير.", "فحص عند الاستلام.", "ضوابط حماية البيانات.", "إبلاغ فوري عند الفقد أو التلف."], "ev": ["سجل الممتلكات", "تقارير الفقد والتلف"], "tip": ""}, "en": {"t": "Property belonging to customers or external providers", "req": "Exercise care with property belonging to customers or external providers while it is under your control: identify, verify, protect and safeguard it. It may include materials, components, tools and equipment, premises, intellectual property and personal data. When property is lost, damaged or found unsuitable, report it to the owner and retain documented information.", "ex": "Free-issue materials from the client are registered, inspected and stored separately at Al-Ufuq Electrical; client drawings are treated as intellectual property; and subscriber data is protected.", "how": ["Keep a register of third-party property.", "Inspect on receipt.", "Apply data protection controls.", "Report loss or damage immediately."], "ev": ["Property register", "Loss and damage reports"], "tip": ""}}, {"n": "8.5.4", "s": "", "ar": {"t": "الحفظ", "req": "احفظ المخرجات أثناء العمل بالقدر اللازم لضمان المطابقة، ويشمل ذلك: التعريف، والمناولة، ومنع التلوث، والتغليف، والتخزين، والنقل، والحماية.", "ex": "تُخزن بكرات الكابلات لدى شركة الأفق على قواعد مرتفعة، وتُغطى أطرافها لمنع دخول الرطوبة.", "how": ["تعليمات تخزين ومناولة.", "فحص دوري للمخازن."], "ev": ["تقارير فحص المخازن"], "tip": ""}, "en": {"t": "Preservation", "req": "Preserve outputs during production and service provision to the extent necessary to maintain conformity, covering identification, handling, contamination control, packaging, storage, transmission or transport, and protection.", "ex": "Cable drums at Al-Ufuq Electrical are stored on raised supports with sealed ends to keep moisture out.", "how": ["Issue storage and handling instructions.", "Inspect stores periodically."], "ev": ["Store inspection reports"], "tip": ""}}, {"n": "8.5.5", "s": "", "ar": {"t": "أنشطة ما بعد التسليم", "req": "أوفِ بمتطلبات ما بعد التسليم، مع مراعاة: التشريعات، والعواقب المحتملة، وطبيعة المنتج واستخدامه وعمره، ومتطلبات العميل، وتغذيته الراجعة.", "ex": "تلتزم شركة الأفق بفترة ضمان، وتستجيب لبلاغات الأعطال خلال مدة محددة.", "how": ["سجل الضمانات.", "آلية استقبال البلاغات والاستجابة."], "ev": ["سجلات الضمان والخدمة"], "tip": ""}, "en": {"t": "Post-delivery activities", "req": "Meet the requirements for post-delivery activities, considering statutory and regulatory requirements, the potential undesired consequences, the nature, use and intended lifetime of the product, customer requirements and customer feedback.", "ex": "Al-Ufuq Electrical honours a warranty period and responds to fault reports within a defined time.", "how": ["Keep a warranty register.", "Define how reports are received and answered."], "ev": ["Warranty and service records"], "tip": ""}}, {"n": "8.5.6", "s": "", "ar": {"t": "ضبط التغييرات", "req": "راجع تغييرات الإنتاج أو تقديم الخدمة واضبطها، ووثّق نتائج المراجعة، ومن اعتمد التغيير، والإجراءات الناتجة.", "ex": "عند تحويل الحفر من يدوي إلى آلي، راجعت شركة الأفق الأثر واعتمدت التغيير وحدّثت تعليمات العمل.", "how": ["نموذج تغيير تشغيلي.", "اعتماد مسؤول مخول."], "ev": ["سجل تغييرات التشغيل"], "tip": ""}, "en": {"t": "Control of changes", "req": "Review and control changes for production or service provision to the extent necessary to ensure continuing conformity, and retain documented information on the results of the review, the persons authorizing the change, and any necessary actions.", "ex": "When excavation moved from manual to mechanical, Al-Ufuq Electrical reviewed the impact, approved the change and updated the work instruction.", "how": ["Use an operational change form.", "Require authorization by a designated role."], "ev": ["Operational change log"], "tip": ""}}, {"n": "8.6", "s": "", "ar": {"t": "الإفراج عن المنتجات والخدمات", "req": "نفّذ ترتيبات التحقق المخططة في المراحل المناسبة. لا يتم الإفراج قبل إكمالها إلا بموافقة جهة مخولة، وموافقة العميل عند الاقتضاء. ووثّق دليل المطابقة لمعايير القبول واسم من اعتمد الإفراج.", "ex": "لا تُسلَّم أي دائرة للتشغيل لدى شركة الأفق قبل اكتمال اختبارات التشغيل وتوقيع مهندس الجودة والاستشاري.", "how": ["قائمة تحقق للإفراج.", "تحديد المخولين بالتوقيع."], "ev": ["شهادات الفحص النهائي", "سجلات الإفراج الموقعة"], "tip": ""}, "en": {"t": "Release of products and services", "req": "Implement the planned verification arrangements at appropriate stages. Release does not proceed until the arrangements are satisfactorily completed, unless approved by a relevant authority and, where applicable, by the customer. Retain evidence of conformity with the acceptance criteria and traceability to the person authorizing release.", "ex": "No circuit is energized at Al-Ufuq Electrical until commissioning tests are complete and both the quality engineer and the consultant have signed.", "how": ["Use a release checklist.", "Name who is authorized to sign."], "ev": ["Final inspection certificates", "Signed release records"], "tip": ""}}, {"n": "8.7.1", "s": "upd", "ar": {"t": "ضبط المخرجات غير المطابقة", "req": "عرِّف المخرجات غير المطابقة واضبطها لمنع استخدامها أو تسليمها، بما فيها المكتشفة بعد التسليم. عالجها بواحدة أو أكثر من: التصحيح، أو العزل أو الاحتواء أو الإرجاع أو إيقاف التوريد، أو إبلاغ العميل، أو القبول بتنازل. وتحقق من المطابقة بعد التصحيح.", "ex": "وصلة كابل فشلت في اختبار العزل لدى شركة الأفق: وُسمت وأوقف العمل عليها، ثم أُعيد تنفيذها واختبارها. وفي حالة انحراف بسيط آخر، قُبل العمل بتنازل موقع من العميل.", "how": ["وسم وعزل فوري.", "تحديد طريقة المعالجة.", "إعادة الفحص بعد التصحيح."], "ev": ["سجل عدم المطابقة", "موافقات التنازل"], "tip": ""}, "en": {"t": "Control of nonconforming outputs", "req": "Identify and control outputs that do not conform, to prevent their unintended use or delivery, including nonconformities detected after delivery. Deal with them by correction; segregation, containment, return or suspension of provision; informing the customer; or obtaining authorization for acceptance under concession. Verify conformity after correction.", "ex": "A cable joint failed the insulation test at Al-Ufuq Electrical: it was tagged, work stopped, then it was redone and retested. For a separate minor deviation, the work was accepted under a concession signed by the client.", "how": ["Tag and segregate immediately.", "Decide the disposition.", "Re-inspect after correction."], "ev": ["Nonconformity log", "Concession approvals"], "tip": ""}}, {"n": "8.7.2", "s": "", "ar": {"t": "توثيق عدم المطابقة", "req": "وثّق: طبيعة عدم المطابقة، والإجراءات المتخذة، والتنازلات، والجهة التي قررت الإجراء.", "ex": "تقرير عدم المطابقة لدى شركة الأفق يحمل رقماً ووصفاً وقرار المعالجة واسم من اعتمده.", "how": ["نموذج موحد.", "سجل مركزي للمتابعة."], "ev": ["تقارير عدم المطابقة المكتملة"], "tip": ""}, "en": {"t": "Documenting nonconformities", "req": "Retain documented information describing the nonconformity, the actions taken, any concessions obtained, and who decided the action.", "ex": "An NCR at Al-Ufuq Electrical carries a number, a description, the disposition and the name of the approver.", "how": ["Use one standard form.", "Keep a central log for follow-up."], "ev": ["Completed nonconformity reports"], "tip": ""}}]}, {"id": "9", "phase": "check", "illo": "evaluation", "ar": {"title": "تقييم الأداء", "short": "التقييم", "intro": "كيف تعرف أن النظام يعمل؟ بالقياس والتحليل والتدقيق، ثم مراجعة الإدارة التي تحوّل النتائج إلى قرارات."}, "en": {"title": "Performance evaluation", "short": "Evaluation", "intro": "How do you know the system works? Through measurement, analysis and audit, and then a management review that turns the results into decisions."}, "subs": [{"n": "9.1.1", "s": "", "ar": {"t": "الرصد والقياس: عام", "req": "حدِّد: ما يجب رصده وقياسه، والطرق التي تضمن نتائج صحيحة، ومتى يتم الرصد، ومتى تُحلَّل النتائج. وقيّم أداء النظام وفعاليته، ووثّق النتائج.", "ex": "لوحة مؤشرات شهرية لدى شركة الأفق: نسبة قبول الفحص، ونسبة الالتزام بالجدول، وعدد الشكاوى.", "how": ["خطة رصد وقياس بالأسئلة الأربعة.", "لوحة مؤشرات.", "مراجعة دورية."], "ev": ["خطة الرصد والقياس", "لوحة المؤشرات"], "tip": ""}, "en": {"t": "Monitoring and measurement: general", "req": "Determine what needs to be monitored and measured, the methods that ensure valid results, when monitoring and measuring is performed, and when the results are analysed and evaluated. Evaluate the performance and effectiveness of the system and retain the results.", "ex": "A monthly dashboard at Al-Ufuq Electrical: inspection acceptance rate, schedule adherence and number of complaints.", "how": ["Build a monitoring plan around the four questions.", "Maintain a KPI dashboard.", "Review it periodically."], "ev": ["Monitoring and measurement plan", "KPI dashboard"], "tip": ""}}, {"n": "9.1.2", "s": "", "ar": {"t": "رضا العملاء", "req": "ارصد رضا العملاء، وحدِّد طرق جمع معلوماته ومراجعتها، مثل: الاستبيانات، والتغذية الراجعة، والاجتماعات، والشكاوى، والإشادات، ومطالبات الضمان، ووسائل التواصل.", "ex": "استبيان نصف سنوي للعميل والاستشاري لدى شركة الأفق، إضافة إلى تحليل ملاحظات اجتماعات التقدم.", "how": ["تحديد مصادر المعلومات.", "جمعها وتحليلها دورياً.", "عرضها في مراجعة الإدارة."], "ev": ["نتائج الاستبيانات", "تحليل الرضا"], "tip": ""}, "en": {"t": "Customer satisfaction", "req": "Monitor customer satisfaction and determine the methods for obtaining, monitoring and reviewing the information, such as surveys, customer feedback, meetings, complaints, compliments, warranty claims and social media.", "ex": "A half-yearly survey of the client and the consultant at Al-Ufuq Electrical, plus analysis of remarks raised in progress meetings.", "how": ["Identify the information sources.", "Collect and analyse periodically.", "Present the results at management review."], "ev": ["Survey results", "Satisfaction analysis"], "tip": ""}}, {"n": "9.1.3", "s": "upd", "ar": {"t": "التحليل والتقييم", "req": "حلّل البيانات وقيّمها، واستخدم النتائج لتقييم: مطابقة المنتجات، ورضا العملاء، وأداء النظام وفعاليته، وفعالية تنفيذ التخطيط، وفعالية إجراءات المخاطر، وفعالية إجراءات الفرص (كلٌّ على حدة)، وأداء الموردين، والحاجة إلى التحسين.", "ex": "أظهر التحليل الربعي لدى شركة الأفق أن 60% من رفض طلبات الفحص سببه نقص الوثائق، فتحول إلى مشروع تحسين. وأظهر أن إجراء اعتماد موردَين للمحولات نجح في خفض التأخير.", "how": ["تقرير تحليل دوري يغطي البنود الثمانية.", "استخدام أدوات إحصائية بسيطة (باريتو، اتجاهات).", "تحويل النتائج إلى إجراءات."], "ev": ["تقارير التحليل", "تحليل الاتجاهات"], "tip": ""}, "en": {"t": "Analysis and evaluation", "req": "Analyse and evaluate the data, and use the results to evaluate product conformity, customer satisfaction, the performance and effectiveness of the system, whether planning has been implemented effectively, the effectiveness of actions taken to address risks, the effectiveness of actions taken to address opportunities (each evaluated separately), the performance of external providers, and the need for improvement.", "ex": "Quarterly analysis at Al-Ufuq Electrical showed 60% of rejected inspection requests were caused by missing documents, which became an improvement project; it also showed that dual-sourcing transformers had cut delays.", "how": ["Issue a periodic analysis report covering all eight areas.", "Use simple statistical tools (Pareto, trends).", "Turn the findings into actions."], "ev": ["Analysis reports", "Trend analysis"], "tip": ""}}, {"n": "9.2.1", "s": "", "ar": {"t": "التدقيق الداخلي: عام", "req": "نفّذ تدقيقات داخلية على فترات مخططة للتحقق من أن النظام مطابق لمتطلبات المنظمة ولمتطلبات المواصفة، وأنه مطبَّق بفعالية ومحافَظ عليه.", "ex": "خطة تدقيق سنوية لدى شركة الأفق تغطي جميع العمليات والمواقع.", "how": ["خطة سنوية شاملة."], "ev": ["خطة التدقيق السنوية"], "tip": ""}, "en": {"t": "Internal audit: general", "req": "Conduct internal audits at planned intervals to provide information on whether the system conforms to the organization's own requirements and to the requirements of the standard, and whether it is effectively implemented and maintained.", "ex": "An annual audit plan at Al-Ufuq Electrical covers all processes and sites.", "how": ["Prepare a comprehensive annual plan."], "ev": ["Annual audit plan"], "tip": ""}}, {"n": "9.2.2", "s": "upd", "ar": {"t": "برنامج التدقيق الداخلي", "req": "خطّط برنامج التدقيق وطبّقه، مع مراعاة أهمية العمليات، ونتائج التدقيقات السابقة، والتغييرات المؤثرة على المنظمة. حدِّد الأهداف والمعايير والنطاق، واختر مدققين يضمنون الموضوعية والحيادية، وأبلغ النتائج، واتخذ التصحيح والإجراءات التصحيحية دون تأخير غير مبرر.", "ex": "بعد تطبيق نظام المشتريات الإلكتروني، زادت شركة الأفق تكرار تدقيق المشتريات، وكلّفت مدققاً من إدارة أخرى لضمان الحيادية.", "how": ["برنامج مبني على المخاطر والتغييرات.", "تأهيل المدققين.", "خطة وتقرير لكل تدقيق.", "متابعة الملاحظات حتى الإغلاق."], "ev": ["برنامج التدقيق", "خطط وتقارير التدقيق", "مؤهلات المدققين"], "tip": "إرشادات التدقيق متاحة في ISO 19011."}, "en": {"t": "Internal audit programme", "req": "Plan, establish, implement and maintain an audit programme, considering the importance of the processes concerned, the results of previous audits, and changes affecting the organization. Define the objectives, criteria and scope of each audit, select auditors who ensure objectivity and impartiality, report the results to relevant managers, and take correction and corrective action without undue delay.", "ex": "After the electronic procurement system went live, Al-Ufuq Electrical increased the audit frequency for procurement and assigned an auditor from another department to preserve impartiality.", "how": ["Base the programme on risk and on changes.", "Qualify the auditors.", "Issue a plan and a report for each audit.", "Follow findings through to closure."], "ev": ["Audit programme", "Audit plans and reports", "Auditor qualifications"], "tip": "Guidance on auditing is available in ISO 19011."}}, {"n": "9.3.1", "s": "", "ar": {"t": "مراجعة الإدارة: عام", "req": "تراجع الإدارة العليا النظام على فترات مخططة للتأكد من ملاءمته وكفايته وفعاليته وتوافقه مع الاتجاه الاستراتيجي.", "ex": "مراجعة نصف سنوية لدى شركة الأفق برئاسة الرئيس التنفيذي.", "how": ["جدول زمني للمراجعات."], "ev": ["جدول الاجتماعات"], "tip": ""}, "en": {"t": "Management review: general", "req": "Top management reviews the system at planned intervals to ensure its continuing suitability, adequacy, effectiveness and alignment with the strategic direction.", "ex": "A half-yearly review at Al-Ufuq Electrical, chaired by the CEO.", "how": ["Set a review schedule."], "ev": ["Meeting schedule"], "tip": ""}}, {"n": "9.3.2", "s": "upd", "ar": {"t": "مدخلات مراجعة الإدارة", "req": "تشمل: حالة الإجراءات السابقة، وتغيرات السياق والأطراف المعنية، وأداء النظام واتجاهاته (عدم المطابقة، والقياس، والتدقيق، ورضا العملاء، والأهداف، والعمليات، والموردين)، وفرص التحسين، وكفاية الموارد، وفعالية إجراءات المخاطر، وفعالية إجراءات الفرص.", "ex": "جدول أعمال مراجعة شركة الأفق مبني على قائمة المدخلات كاملة، مع عرض لكل بند.", "how": ["قالب جدول أعمال بكل المدخلات.", "إعداد العروض مسبقاً."], "ev": ["جدول الأعمال", "العروض المرفقة"], "tip": ""}, "en": {"t": "Management review inputs", "req": "Inputs include the status of actions from previous reviews; changes in external and internal issues and in the needs of interested parties; information on performance and its trends (nonconformities and corrective actions, monitoring results, audit results, customer satisfaction and feedback, the extent to which objectives were met, process performance and product conformity, and external provider performance); opportunities for improvement; adequacy of resources; effectiveness of actions to address risks; and effectiveness of actions to address opportunities.", "ex": "Al-Ufuq Electrical's review agenda follows the full input list, with a presentation for each item.", "how": ["Use an agenda template covering every input.", "Prepare the presentations in advance."], "ev": ["Agenda", "Supporting presentations"], "tip": ""}}, {"n": "9.3.3", "s": "", "ar": {"t": "مخرجات مراجعة الإدارة", "req": "تتضمن قرارات بشأن فرص التحسين، والتغييرات المطلوبة في النظام، واحتياجات الموارد، مع التوثيق.", "ex": "قرارات مراجعة شركة الأفق: تعيين مهندس جودة إضافي، واعتماد النظام الإلكتروني، وهدف جديد لرضا العملاء.", "how": ["محضر بالقرارات والمسؤولين والمواعيد.", "متابعة التنفيذ في المراجعة التالية."], "ev": ["محضر مراجعة الإدارة"], "tip": ""}, "en": {"t": "Management review results", "req": "Results include decisions on continual improvement opportunities, any need for changes to the system, and resource needs, retained as documented information.", "ex": "Decisions from Al-Ufuq Electrical's review: hire an additional quality engineer, approve the electronic system, and set a new customer satisfaction target.", "how": ["Issue minutes with decisions, owners and due dates.", "Track implementation at the next review."], "ev": ["Management review minutes"], "tip": ""}}]}, {"id": "10", "phase": "act", "illo": "improve", "ar": {"title": "التحسين", "short": "التحسين", "intro": "إغلاق الدورة: معالجة المشكلات من جذورها، والبحث المستمر عن طرق أفضل، ثم العودة إلى التخطيط بمعرفة أعمق."}, "en": {"title": "Improvement", "short": "Improvement", "intro": "Closing the loop: fixing problems at their root, looking continuously for better ways, and returning to planning with deeper knowledge."}, "subs": [{"n": "10.1", "s": "upd", "ar": {"t": "التحسين المستمر", "req": "حسّن ملاءمة النظام وكفايته وفعاليته باستمرار. استخدم نتائج الرصد والتحليل ومراجعة الإدارة لتحديد الفرص ومعالجتها. تشمل الإجراءات: تحسين العمليات والمنتجات، وتلبية الاحتياجات المستقبلية، وتصحيح الآثار غير المرغوبة أو منعها أو تقليلها. وقد يكون التحسين تدريجياً أو جذرياً أو ابتكاراً أو إعادة تنظيم.", "ex": "مشروع تحسين لدى شركة الأفق بمنهجية Lean خفّض زمن إعداد طلب الفحص من ثلاثة أيام إلى يوم واحد.", "how": ["سجل مشاريع التحسين.", "منهجية واضحة (PDCA، Lean، Six Sigma).", "قياس قبل وبعد."], "ev": ["سجل مشاريع التحسين", "النتائج قبل وبعد"], "tip": ""}, "en": {"t": "Continual improvement", "req": "Continually improve the suitability, adequacy and effectiveness of the system. Use the results of monitoring, analysis and management review to determine opportunities and address them. Actions include improving processes, products and services; addressing future needs and expectations; and correcting, preventing or reducing undesired effects. Improvement can be incremental or breakthrough, through innovation or reorganization.", "ex": "A Lean improvement project at Al-Ufuq Electrical cut inspection request preparation time from three days to one.", "how": ["Keep a register of improvement projects.", "Use a clear method (PDCA, Lean, Six Sigma).", "Measure before and after."], "ev": ["Improvement project register", "Before-and-after results"], "tip": ""}}, {"n": "10.2.1", "s": "", "ar": {"t": "عدم المطابقة والإجراء التصحيحي", "req": "عند حدوث عدم مطابقة: تفاعل معها (اضبطها وصححها وعالج عواقبها)، وقيّم الحاجة لإزالة السبب عبر المراجعة وتحليل الأسباب والبحث عن حالات مشابهة، ونفّذ الإجراء، وراجع فعاليته، وحدِّث المخاطر والفرص، وعدّل النظام عند الحاجة. ويجب أن يتناسب الإجراء مع أثر عدم المطابقة.", "ex": "تكرر رفض وصلات الكابلات لدى شركة الأفق. بعد الاحتواء، أظهر تحليل الأسباب الخمسة أن الأداة غير مناسبة والتدريب غير كافٍ. الإجراء: أداة جديدة وتدريب واعتماد الفنيين، ثم فحص المشاريع الأخرى، وقياس الفعالية بعد ثلاثة أشهر، وتحديث سجل المخاطر.", "how": ["احتواء وتصحيح فوري.", "تحليل السبب الجذري (5 Whys أو Fishbone).", "البحث عن حالات مشابهة.", "تنفيذ الإجراء.", "التحقق من الفعالية وتحديث المخاطر."], "ev": ["سجل الإجراءات التصحيحية", "تحليل السبب الجذري", "دليل الفعالية"], "tip": "الفرق المهم: التصحيح يعالج الأثر، والإجراء التصحيحي يزيل السبب."}, "en": {"t": "Nonconformity and corrective action", "req": "When a nonconformity occurs, react to it (control and correct it, deal with the consequences), evaluate the need for action to eliminate the cause by reviewing the nonconformity, determining its causes and checking whether similar ones exist or could occur, implement the action, review its effectiveness, update risks and opportunities, and change the system if necessary. Corrective actions must be appropriate to the effects of the nonconformity.", "ex": "Cable joints were repeatedly rejected at Al-Ufuq Electrical. After containment, a five-whys analysis showed the tool was unsuitable and training inadequate. Actions: a new tool, training and certification of jointers, a check across other projects, effectiveness measured after three months, and the risk register updated.", "how": ["Contain and correct immediately.", "Run a root cause analysis (5 Whys or fishbone).", "Check for similar cases elsewhere.", "Implement the action.", "Verify effectiveness and update the risks."], "ev": ["Corrective action register", "Root cause analysis", "Evidence of effectiveness"], "tip": "The key distinction: correction fixes the effect, corrective action removes the cause."}}, {"n": "10.2.2", "s": "", "ar": {"t": "توثيق الإجراءات التصحيحية", "req": "وثّق طبيعة عدم المطابقة والإجراءات المتخذة، ونتائج أي إجراء تصحيحي.", "ex": "سجل الإجراءات التصحيحية لدى شركة الأفق لا يُغلق إلا بدليل على الفعالية.", "how": ["نموذج موحد.", "معيار إغلاق واضح."], "ev": ["نماذج الإجراءات التصحيحية المغلقة"], "tip": ""}, "en": {"t": "Documenting corrective action", "req": "Retain documented information as evidence of the nature of the nonconformities and any subsequent actions taken, and of the results of any corrective action.", "ex": "A corrective action at Al-Ufuq Electrical is not closed without evidence of effectiveness.", "how": ["Use one standard form.", "Set a clear closure criterion."], "ev": ["Closed corrective action forms"], "tip": ""}}]}], "changes": [{"c": "#1B2A4A", "bg": "#E6EAF2", "refs": ["5.1.1", "7.3", "7.1.4"], "icon": "<path d=\"M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z\"/><path d=\"M9 12l2 2 4-4\"/>", "ar": {"t": "ثقافة الجودة والسلوك الأخلاقي", "d": "انتقلت من المبادئ إلى المتطلبات: التزام القيادة، والوعي، وبيئة العمل."}, "en": {"t": "Quality culture and ethical behaviour", "d": "Moved from principles into requirements: leadership commitment, awareness and the work environment."}}, {"c": "#1E8C93", "bg": "#E3F4F4", "refs": ["6.1.2", "6.1.3", "9.1.3"], "icon": "<path d=\"M4 20h16\"/><path d=\"M6 16l4-5 3 3 5-7\"/><circle cx=\"18\" cy=\"7\" r=\"1.5\"/>", "ar": {"t": "فصل المخاطر عن الفرص", "d": "بند مستقل لكل منهما: تحديد وتحليل وتقييم، مع تناسب الإجراء مع الأثر."}, "en": {"t": "Risks separated from opportunities", "d": "A clause for each: determine, analyse and evaluate, with actions proportionate to the impact."}}, {"c": "#3563C9", "bg": "#E7EEFB", "refs": ["6.3", "5.3"], "icon": "<path d=\"M4 12a8 8 0 0 1 14-5.3\"/><path d=\"M18 3v4h-4\"/><path d=\"M20 12a8 8 0 0 1-14 5.3\"/><path d=\"M6 21v-4h4\"/>", "ar": {"t": "إدارة تغيير أقوى", "d": "سبعة اعتبارات عند تخطيط التغيير، ومسؤولية صريحة لحماية سلامة النظام."}, "en": {"t": "Stronger management of change", "d": "Seven considerations when planning change, and explicit responsibility for protecting system integrity."}}, {"c": "#7B5BB8", "bg": "#EFEAF8", "refs": ["4.1", "4.2"], "icon": "<path d=\"M12 3v2M5.6 5.6l1.4 1.4M3 12h2M18.4 5.6 17 7\"/><path d=\"M8 12a4 4 0 1 1 7.5 2\"/><path d=\"M7 19h10a3 3 0 0 0 0-6h-.5\"/>", "ar": {"t": "تغيّر المناخ ضمن السياق", "d": "دمج تعديل 2024: قرار صريح بشأن صلة تغير المناخ، ومتابعة المعلومات."}, "en": {"t": "Climate change inside the context", "d": "The 2024 amendment is now built in: an explicit decision on relevance, and monitoring of the information."}}, {"c": "#C9821A", "bg": "#FCF1DE", "refs": ["3"], "icon": "<path d=\"M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z\"/><path d=\"M5 17a3 3 0 0 1 3-3h11\"/>", "ar": {"t": "مصطلحات داخل المواصفة", "d": "البند 3 يضم الآن التعريفات الأساسية لأنظمة الإدارة، مع بقاء ISO 9000 مرجعاً."}, "en": {"t": "Terms inside the standard", "d": "Clause 3 now carries the core management system definitions, with ISO 9000 still the normative reference."}}, {"c": "#3C9A5F", "bg": "#E5F4EA", "refs": ["A"], "icon": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8h.01M11 12h1v5h1\"/>", "ar": {"t": "ملحق توضيحي موسّع", "d": "الملحق (A) يشرح مقصد كل بند والكلمات المفتاحية، وحُذف الملحق (B)."}, "en": {"t": "An expanded explanatory annex", "d": "Annex A explains the intent of each clause and the key wording; Annex B has been removed."}}], "terms": [["3.1", "Organization", "المنظمة", "أي كيان له وظائف ومسؤوليات يسعى لأهداف، من فرد يعمل لحسابه إلى شركة كبرى. وإذا غطى النظام جزءاً من كيان أكبر فالمقصود ذلك الجزء.", "Any entity with its own functions and responsibilities pursuing objectives, from a sole trader to a corporation. If the system covers part of a larger entity, the term means that part only."], ["3.2", "Interested party", "الطرف المعني", "كل من يؤثر في قراراتك أو يتأثر بها أو يرى أنه متأثر: العملاء، والملاك، والموظفون، والموردون، والجهات التنظيمية، والمجتمع.", "Anyone who can affect, be affected by, or perceive themselves to be affected by your decisions: customers, owners, employees, providers, regulators, society."], ["3.3", "Top management", "الإدارة العليا", "من يوجّه المنظمة ويتحكم فيها على أعلى مستوى ضمن نطاق النظام، ويملك التفويض وتوفير الموارد.", "The person or group who directs and controls the organization at the highest level within the system's scope, with power to delegate authority and provide resources."], ["3.4", "Management system", "نظام الإدارة", "العناصر المترابطة (الهيكل، والأدوار، والتخطيط، والسياسات، والممارسات) التي تضع بها المنظمة سياساتها وأهدافها وعملياتها.", "The interrelated elements (structure, roles, planning, policies, practices) an organization uses to establish policies, objectives and processes."], ["3.4.1", "Quality management system", "نظام إدارة الجودة", "الجزء من نظام الإدارة الكلي المختص بالجودة.", "The part of the overall management system that relates to quality."], ["3.5", "Policy", "السياسة", "توجّهات المنظمة كما تعلنها الإدارة العليا رسمياً.", "The intentions and direction of the organization as formally expressed by top management."], ["3.5.1", "Quality policy", "سياسة الجودة", "السياسة الخاصة بالجودة، متسقة مع التوجه العام، وتشكل إطاراً لأهداف الجودة.", "The policy related to quality: generally consistent with the overall policy and providing a framework for quality objectives."], ["3.6", "Objective", "الهدف", "نتيجة مطلوب تحقيقها: استراتيجية أو تكتيكية أو تشغيلية.", "A result to be achieved; it can be strategic, tactical or operational."], ["3.6.1", "Quality objective", "هدف الجودة", "هدف مرتبط بالجودة، يُبنى على السياسة ويُحدد للوظائف والمستويات والعمليات.", "An objective related to quality, generally based on the policy and set for relevant functions, levels and processes."], ["3.7", "Risk", "المخاطر", "أثر عدم اليقين: انحراف عن المتوقع قد يكون إيجابياً أو سلبياً، ويُعبَّر عنه غالباً بالعاقبة واحتماليتها.", "The effect of uncertainty: a deviation from the expected, positive or negative, usually expressed as a consequence combined with its likelihood."], ["3.8", "Process", "العملية", "أنشطة مترابطة تحوّل مدخلات إلى نتيجة. والتي يصعب التحقق من مخرجها مباشرة تُسمى عملية خاصة.", "Interrelated activities that use or transform inputs to deliver a result. One whose output cannot be readily verified is often called a special process."], ["3.9", "Competence", "الكفاءة", "القدرة على تطبيق المعرفة والمهارات لتحقيق النتائج، وليست مجرد شهادة.", "The ability to apply knowledge and skills to achieve intended results, not merely holding a certificate."], ["3.10", "Documented information", "المعلومات الموثقة", "معلومات يلزم ضبطها بأي وسيط، وتشمل ما كان يُسمى وثائق وسجلات.", "Information required to be controlled and maintained, in any medium; it covers what used to be called documents and records."], ["3.11", "Performance", "الأداء", "نتيجة قابلة للقياس، كمية أو نوعية.", "A measurable result, whether quantitative or qualitative."], ["3.12", "Continual improvement", "التحسين المستمر", "نشاط متكرر لرفع الأداء، مستمر على فترات وليس متصلاً بلا انقطاع.", "A recurring activity to enhance performance: repeated over time with intervals, not uninterrupted."], ["3.13", "Effectiveness", "الفعالية", "مدى تنفيذ ما خُطط له وتحقيق النتائج المخططة.", "The extent to which planned activities are realized and planned results achieved."], ["3.14", "Requirement", "المتطلب", "حاجة أو توقع: معلن، أو ضمني حسب العرف، أو إلزامي.", "A need or expectation that is stated, generally implied by custom, or obligatory."], ["3.15", "Conformity", "المطابقة", "استيفاء المتطلب.", "The fulfilment of a requirement."], ["3.16", "Nonconformity", "عدم المطابقة", "عدم استيفاء المتطلب.", "The non-fulfilment of a requirement."], ["3.17", "Corrective action", "الإجراء التصحيحي", "إزالة سبب عدم المطابقة ومنع تكرارها، بخلاف الإجراء الوقائي الذي يمنع الحدوث أصلاً.", "Action to eliminate the cause of a nonconformity and prevent recurrence, as opposed to preventive action, which prevents occurrence."], ["3.18", "Audit", "التدقيق", "عملية منهجية ومستقلة لجمع الأدلة وتقييمها بموضوعية. قد يكون طرف أول أو ثانٍ أو ثالث، ومدمجاً أو مشتركاً.", "A systematic and independent process for obtaining evidence and evaluating it objectively. It may be first, second or third party, and combined or joint."], ["3.19", "Measurement", "القياس", "عملية لتحديد قيمة.", "A process to determine a value."], ["3.20", "Monitoring", "الرصد", "تحديد حالة نظام أو عملية أو نشاط، وقد يتطلب فحصاً أو إشرافاً على مراحل.", "Determining the status of a system, process or activity; it may require checking, supervising or observing at different stages."]], "pairs": [{"ar": "مناسب أم قابل للتطبيق؟", "en": "Appropriate or applicable?", "items": [["مناسب", "Appropriate", "يعتمد على تقدير المنظمة لما يلائم سياقها.", "Depends on the organization's judgement about what suits its context."], ["قابل للتطبيق", "Applicable", "إذا كان المتطلب ذا صلة أو ممكناً فهو ملزم.", "If the requirement is relevant or possible, it applies and is binding."], ["حسب الاقتضاء", "As applicable", "المتطلب قد لا ينطبق في حالات معينة حتى لو انطبق البند عموماً.", "A requirement may not apply in certain situations even where the clause generally applies."]]}, {"ar": "يأخذ في الاعتبار أم يراعي؟", "en": "Consider or take into account?", "items": [["يأخذ في الاعتبار", "Consider", "التفكير في الموضوع لتقرير إدراجه في القرار أو عدمه.", "Think about the topic to decide whether it belongs in the decision."], ["يراعي", "Take into account", "التفكير في الموضوع وإدراجه فعلاً في القرار أو الإجراء.", "Think about the topic and actually include it in the decision or action."]]}, {"ar": "مستمر بأي معنى؟", "en": "Continual or continuous?", "items": [["مستمر على فترات", "Continual", "استمرار مع فترات توقف، وهو المقصود في التحسين.", "Duration over time with intervals of interruption: the right word for improvement."], ["متصل", "Continuous", "استمرار بلا انقطاع، ولا تستخدمه المواصفة.", "Duration without interruption; the standard does not use this word."]]}, {"ar": "الوثائق والسجلات", "en": "Documents and records", "items": [["متاح كمعلومات موثقة", "Available as documented information", "معلومات تُستخدم وتُتاح، أي ما كان يُسمى وثائق.", "Information that is obtained, used and made available: what used to be called documents."], ["متاح كدليل على", "Available as evidence of", "الاحتفاظ بدليل موضوعي، أي ما كان يُسمى سجلات، دون معنى قانوني.", "Retention of objective evidence: what used to be called records, with no legal evidential meaning implied."]]}, {"ar": "كلمات أخرى", "en": "Other wording", "items": [["يضمن", "Ensure", "مسؤولية عن تحقق النتيجة، ويجوز تفويض التنفيذ.", "Accountability for the result; the activity itself may be delegated."], ["الاتجاه الاستراتيجي", "Strategic direction", "القرارات والخطط المنسقة التي توجه المنظمة نحو أهدافها.", "The coordinated decisions, plans and actions guiding the organization toward its objectives."], ["ترتيب القوائم", "List order", "للمرجعية فقط، ولا يعني أولوية إلا إذا نُص على ذلك.", "Numbering is for reference only; it implies no sequence or priority unless stated."]]}, {"ar": "غير قابل للتطبيق", "en": "Not applicable", "items": [["الشرط", "Not applicable", "قرار مدروس ومبرر، بشرط ألا يمس المطابقة أو رضا العملاء أو الالتزامات التشريعية.", "A considered, justified decision, provided it does not affect conformity, customer satisfaction or statutory obligations."], ["التفكير بالمخاطر", "Risk-based thinking", "لا يشترط منهجية رسمية ولا إجراءً موثقاً لإدارة المخاطر.", "Does not require a formal risk management approach or a documented risk process."]]}], "timeline": [["سبتمبر 2026", "September 2026", "نشر الإصدار السادس من المواصفة.", "The sixth edition is published."], ["نهاية 2026 — 2027", "Late 2026 – 2027", "تأهيل جهات المنح واعتمادها على الإصدار الجديد.", "Certification bodies are accredited for the new edition."], ["خلال 2027", "During 2027", "صدور أولى الشهادات وفق إصدار 2026.", "The first certificates to the 2026 edition are issued."], ["حوالي سبتمبر 2029", "Around September 2029", "نهاية الفترة الانتقالية المتوقعة (3 سنوات).", "Expected end of the three-year transition period."]], "ui": {"ar": {"brand": "دليل ISO 9001:2026 التفاعلي", "by": "إعداد: مدثر سلامه", "nav": ["دائرة البنود", "ما الجديد", "المصطلحات", "مفاتيح التفسير", "الانتقال"], "subtitle": "Quality management systems — Requirements", "h1": "أنظمة إدارة الجودة: دليل تفاعلي للفهم والتطبيق", "lede": "كل بند من البنود 4 إلى 10 مشروح بلغة بسيطة، مع مثال تطبيقي من شركة مقاولات، وخطوات تطبيق، والأدلة التي يطلبها المدقق.", "tag": "نسخة للفهم والشرح والتبسيط", "prep": "إعداد", "wheelTitle": "بنود المواصفة على دورة PDCA", "wheelSub": "خطِّط، نفِّذ، تحقَّق، حسِّن — والقيادة في المركز.", "hint": "اضغط على أي بند لعرض المتطلبات والأمثلة", "searchPh": "ابحث عن موضوع: معايرة، مورد، مخاطر، تدقيق، تغيير...", "noRes": "لا توجد نتائج لهذه الكلمة. جرّب كلمة أقصر مثل: مورد، معايرة، تدقيق.", "changesTitle": "ما الذي تغيّر في إصدار 2026", "changesSub": "مراجعة تطويرية: الهيكل ثابت، مع تشديد في ستة محاور. اضغط على رقم البند لفتحه.", "glossTitle": "المصطلحات الأساسية (البند 3)", "glossSub": "المقابل العربي المستخدم في الممارسة مع شرح مبسط. المرجع الكامل للمفردات يبقى ISO 9000.", "glossPh": "ابحث بالعربي أو الإنجليزي...", "glossNo": "لا يوجد مصطلح مطابق. جرّب الكلمة بالإنجليزي.", "annexTitle": "مفاتيح التفسير من الملحق (A)", "annexSub": "الملحق إرشادي ولا يضيف متطلبات، لكنه يحسم خلافات شائعة بين المدقق والمنظمة.", "transTitle": "الجدول الزمني المتوقع للانتقال", "transNote": "مدة الفترة الانتقالية تقديرية بناءً على السوابق، والقرار الرسمي يصدر عن المنتدى الدولي للاعتماد IAF. شهادات إصدار 2015 تبقى سارية خلال الفترة الانتقالية.", "footName": "مدثر سلامه — نسخة للفهم والشرح والتبسيط", "foot": "هذا الدليل شرح تفسيري لأغراض الفهم والتدريب، وليس ترجمة للمواصفة ولا بديلاً عنها. النص الرسمي المعتمد هو ISO 9001:2026 الصادر عن المنظمة الدولية للتقييس (ISO) وحقوقه محفوظة لها، ويُرجع إليه عند التطبيق والتدقيق. الأمثلة مبنية على شركة افتراضية لأغراض الشرح.", "close": "إغلاق", "prev": "البند السابق", "next": "البند التالي", "openAll": "فتح الكل", "collapseAll": "طي الكل", "onlyNew": "الجديد والمُحدَّث فقط", "count": "عدد المتطلبات الفرعية:", "subsIn": "عدد المتطلبات الفرعية:", "pReq": "المتطلب ببساطة", "pEx": "مثال من الواقع", "pHow": "آلية التطبيق", "pEv": "ما يطلبه المدقق", "tip": "ملاحظة الخبير: ", "badgeNew": "جديد 2026", "badgeUpd": "مُحدَّث", "switch": "English", "switchAria": "Switch to English", "caps": {"context": "طبقات السياق والأطراف المعنية", "leadership": "القيادة تحوّل السياسة إلى نتائج، على أساس من ثقافة الجودة", "risk": "مثال مصفوفة تقييم المخاطر، ومسار استثمار الفرص", "support": "الموارد التي يحتاجها النظام ليعمل", "operation": "سلسلة التشغيل ومسار ضبط غير المطابق", "evaluation": "دورة تقييم الأداء", "improve": "مسار معالجة عدم المطابقة"}, "legend": ["المدخلات: السياق", "خطِّط", "نفِّذ", "تحقَّق", "حسِّن", "القيادة"], "phases": {"ctx": "مدخلات الدورة", "lead": "مركز الدورة", "plan": "خطِّط (Plan)", "do": "نفِّذ (Do)", "check": "تحقَّق (Check)", "act": "حسِّن (Act)"}}, "en": {"brand": "ISO 9001:2026 Interactive Guide", "by": "Prepared by Modather Salama", "nav": ["Clause wheel", "What changed", "Terms", "Wording keys", "Transition"], "subtitle": "Quality management systems — Requirements", "h1": "A working guide to understanding and applying the standard", "lede": "Every clause from 4 to 10 explained in plain language, with a worked example from a contracting company, the steps to apply it, and the evidence an auditor will ask for.", "tag": "Explanatory edition — for understanding and training", "prep": "Prepared by", "wheelTitle": "The clauses on the PDCA cycle", "wheelSub": "Plan, Do, Check, Act — with leadership at the centre.", "hint": "Select any clause to see its requirements and examples", "searchPh": "Search a topic: calibration, supplier, risk, audit, change...", "noRes": "Nothing matched. Try a shorter word such as supplier, audit or calibration.", "changesTitle": "What changed in the 2026 edition", "changesSub": "An evolutionary revision: the structure holds, with six areas tightened. Select a clause number to open it.", "glossTitle": "Core terms (Clause 3)", "glossSub": "The terms now carried inside the standard, with a plain explanation. ISO 9000 remains the full vocabulary reference.", "glossPh": "Search in English or Arabic...", "glossNo": "No matching term. Try the Arabic word.", "annexTitle": "Wording keys from Annex A", "annexSub": "The annex is informative and adds no requirements, but it settles the arguments that come up most often in audits.", "transTitle": "Expected transition timeline", "transNote": "The transition length is an estimate based on precedent; the formal decision rests with the IAF. Certificates to the 2015 edition stay valid throughout the transition.", "footName": "Modather Salama — explanatory edition", "foot": "This guide is an explanatory commentary for understanding and training. It is not a translation of the standard and not a substitute for it. The authoritative text is ISO 9001:2026, published by ISO and protected by its copyright; refer to it for implementation and audit. The examples are based on a fictional company.", "close": "Close", "prev": "Previous clause", "next": "Next clause", "openAll": "Expand all", "collapseAll": "Collapse all", "onlyNew": "New and updated only", "count": "Sub-clauses:", "subsIn": "Sub-clauses:", "pReq": "The requirement     <text x="${outX+72}" y="400" text-anchor="middle" font-size="12" fill="#4B5874">${ob[5]}</text>`);
  const inArrowFrom = rtl()?750:150, inArrowTo = rtl()?738:162;
  g.push(`<line x1="${inArrowFrom}" y1="320" x2="${inArrowTo}" y2="320" stroke="#7B5BB8" stroke-width="2.5" marker-end="url(#wArrow)"/>`);
  const outFrom = rtl()?166:734, outTo = rtl()?148:752;
  g.push(`<line x1="${outFrom}" y1="320" x2="${outTo}" y2="320" stroke="#3C9A5F" stroke-width="2.5" marker-end="url(#wArrow)"/>`);
  g.push(`<text x="${CX}" y="624" text-anchor="middle" font-size="13" fill="#7A869E">${sv.wheelFoot}</text>`);
  const svg=document.getElementById("pdca");
  svg.innerHTML=g.join("");
  svg.querySelectorAll(".seg").forEach(el=>{
    el.addEventListener("click",()=>openClause(el.dataset.id));
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openClause(el.dataset.id);}});
  });
}

/* ---------- sections ---------- */
function norm(s){return String(s).replace(/[\u064B-\u0652\u0640]/g,"").replace(/[\u0623\u0625\u0622]/g,"\u0627").replace(/\u0629/g,"\u0647").replace(/\u0649/g,"\u064A").toLowerCase();}
function buildIndex(){
  const idx=document.getElementById("index"), u=U();
  idx.innerHTML=CL.map(c=>`<button data-id="${c.id}"><span class="n" style="color:${PHC[c.phase].c}">${c.id}</span><span class="t">${c[L].title}<br><small style="color:var(--muted);font-weight:500">${u.count} ${c.subs.length}</small></span></button>`).join("");
  idx.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>openClause(b.dataset.id)));
}
function buildLegend(){
  const keys=["ctx","plan","do","check","act","lead"];
  document.getElementById("legend").innerHTML=U().legend.map((t,i)=>`<span><i style="background:${PHC[keys[i]].c}"></i>${t}</span>`).join("");
}
function buildSearch(){
  const q=document.getElementById("q"), out=document.getElementById("results");
  q.oninput=()=>{
    const v=norm(q.value.trim()); if(v.length<2){out.innerHTML="";return;}
    const hits=[];
    CL.forEach(c=>c.subs.forEach(s=>{
      const d=s[L]; const hay=norm([s.n,d.t,d.req,d.ex,d.how.join(" "),d.ev.join(" ")].join(" "));
      if(hay.includes(v)) hits.push({c,s});
    }));
    out.innerHTML=hits.length?hits.slice(0,12).map(h=>`<li><button data-id="${h.c.id}" data-sub="${h.s.n}"><span class="rn">${h.s.n}</span><span><span class="rt">${h.s[L].t}</span><br><span class="rs">${h.c.id} — ${h.c[L].title}</span></span></button></li>`).join("")
      :`<li class="empty">${U().noRes}</li>`;
    out.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>openClause(b.dataset.id,b.dataset.sub)));
  };
}
function buildChanges(){
  const el=document.getElementById("changeList");
  el.innerHTML=DATA.changes.map(c=>`<article class="change">
    <div class="ic" style="background:${c.bg};color:${c.c}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg></div>
    <div><h3>${c[L].t}</h3><p>${c[L].d}</p><div class="refs">${c.refs.map(r=>`<button class="chip" data-ref="${r}">${r==="A"?(L==="ar"?"الملحق A":"Annex A"):r==="3"?(L==="ar"?"البند 3":"Clause 3"):r}</button>`).join("")}</div></div></article>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
    const r=b.dataset.ref;
    if(r==="3"){location.hash="#glossary";return;}
    if(r==="A"){location.hash="#annex";return;}
    openClause(r.split(".")[0],r);
  }));
}
function buildGlossary(){
  const list=document.getElementById("glist"), q=document.getElementById("gq");
  q.placeholder=U().glossPh;
  const render=()=>{const v=norm(q.value.trim());
    const rows=DATA.terms.filter(t=>!v||norm(t.join(" ")).includes(v));
    list.innerHTML=rows.length?rows.map(t=>`<div class="term"><header><h4>${L==="ar"?t[2]:t[1]}</h4><span class="en">${L==="ar"?t[1]:t[2]}</span></header><div class="ref">${t[0]}</div><p>${L==="ar"?t[3]:t[4]}</p></div>`).join("")
      :`<p style="color:var(--ink-soft)">${U().glossNo}</p>`;};
  q.oninput=render; render();
}
function buildPairs(){
  document.getElementById("pairs").innerHTML=DATA.pairs.map(p=>`<div class="pair"><h3>${p[L]}</h3><dl>${p.items.map(i=>`<dt>${L==="ar"?i[0]:i[1]} <span>${L==="ar"?i[1]:i[0]}</span></dt><dd>${L==="ar"?i[2]:i[3]}</dd>`).join("")}</dl></div>`).join("");
}
function buildTimeline(){
  document.getElementById("timeline").innerHTML=DATA.timeline.map((t,i)=>`<li><div class="step">${i+1}</div><div class="when">${L==="ar"?t[0]:t[1]}</div><div class="what">${L==="ar"?t[2]:t[3]}</div></li>`).join("");
}

/* ---------- drawer ---------- */
const drawer=document.getElementById("drawer"), scrim=document.getElementById("scrim");
let current=null, lastFocus=null;
const chev=`<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>`;
const ico={
  req:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12h6M9 16h4"/></svg>`,
  ex:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>`,
  how:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="18" cy="6" r="2"/><circle cx="15" cy="18" r="2"/></svg>`,
  ev:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg>`};
function renderSub(s,ph){
  const u=U(), d=s[L];
  const badge=s.s==="new"?`<span class="badge new">${u.badgeNew}</span>`:s.s==="upd"?`<span class="badge upd">${u.badgeUpd}</span>`:"";
  return `<div class="sub" data-n="${s.n}" data-s="${s.s}">
    <button aria-expanded="false"><span class="sn" style="background:${ph.t};color:${ph.c}">${s.n}</span><span class="st">${d.t}</span>${badge}${chev}</button>
    <div class="sub-body"><div class="panes">
      <div class="pane req"><h5>${ico.req}${u.pReq}</h5><p>${d.req}</p></div>
      <div class="pane ex"><h5>${ico.ex}${u.pEx}</h5><p>${d.ex}</p></div>
      <div class="pane how"><h5>${ico.how}${u.pHow}</h5><ol>${d.how.map(h=>`<li>${h}</li>`).join("")}</ol></div>
      <div class="pane ev"><h5>${ico.ev}${u.pEv}</h5><div class="ev-list">${d.ev.map(e=>`<span>${e}</span>`).join("")}</div></div>
      ${d.tip?`<div class="tip"><strong>${u.tip}</strong>${d.tip}</div>`:""}
    </div></div></div>`;
}
function openClause(id,subN,keepScroll){
  const c=CL.find(x=>x.id===id); if(!c) return;
  current=id; const ph=PHC[c.phase], u=U();
  document.getElementById("dHead").style.background=`linear-gradient(135deg, ${ph.c}, ${ph.c}dd)`;
  document.getElementById("dNum").textContent=c.id;
  document.getElementById("dPhase").textContent=u.phases[c.phase];
  document.getElementById("dTitle").textContent=c[L].title;
  const changed=c.subs.filter(s=>s.s).length;
  document.getElementById("dBody").innerHTML=`
    <p class="d-intro">${c[L].intro}</p>
    <figure class="illo">${ILLO[c.illo]()}<figcaption>${u.caps[c.illo]}</figcaption></figure>
    <div class="d-tools">
      <button class="tbtn" id="tAll" aria-pressed="false">${u.openAll}</button>
      <button class="tbtn" id="tNew" aria-pressed="false">${u.onlyNew} (${changed})</button>
      <span class="count">${u.subsIn} ${c.subs.length}</span>
    </div>
    <div id="subs">${c.subs.map(s=>renderSub(s,ph)).join("")}</div>`;
  wireSubs();
  const i=ORDER.indexOf(id), prev=document.getElementById("dPrev"), next=document.getElementById("dNext");
  prev.disabled=i===0; next.disabled=i===ORDER.length-1;
  prev.textContent=i>0?`${u.prev}: ${CL[i-1][L].title}`:u.prev;
  next.textContent=i<ORDER.length-1?`${u.next}: ${CL[i+1][L].title}`:u.next;
  document.getElementById("dClose").setAttribute("aria-label",u.close);
  document.getElementById("dLangLabel").textContent=u.switch;
  document.getElementById("dLang").setAttribute("aria-label",u.switchAria);
  if(!drawer.classList.contains("on")) lastFocus=document.activeElement;
  drawer.classList.add("on"); scrim.classList.add("on"); drawer.setAttribute("aria-hidden","false"); document.body.classList.add("lock");
  const body=document.getElementById("dBody"); if(!keepScroll) body.scrollTop=0;
  if(subN){const el=body.querySelector(`.sub[data-n="${subN}"]`); if(el){toggle(el,true); setTimeout(()=>el.scrollIntoView({block:"start",behavior:"smooth"}),380);} }
  else {const first=body.querySelector(".sub"); if(first) toggle(first,true);}
  if(!keepScroll) setTimeout(()=>document.getElementById("dClose").focus(),50);
}
function toggle(el,force){
  const open=force===undefined?!el.classList.contains("open"):force;
  el.classList.toggle("open",open); el.querySelector("button").setAttribute("aria-expanded",open);
}
function wireSubs(){
  const u=U();
  document.querySelectorAll("#subs .sub > button").forEach(b=>b.addEventListener("click",()=>toggle(b.parentElement)));
  const tAll=document.getElementById("tAll");
  tAll.addEventListener("click",()=>{const on=tAll.getAttribute("aria-pressed")!=="true"; tAll.setAttribute("aria-pressed",on); tAll.textContent=on?u.collapseAll:u.openAll;
    document.querySelectorAll("#subs .sub").forEach(s=>{if(s.style.display!=="none") toggle(s,on);});});
  const tNew=document.getElementById("tNew");
  tNew.addEventListener("click",()=>{const on=tNew.getAttribute("aria-pressed")!=="true"; tNew.setAttribute("aria-pressed",on);
    document.querySelectorAll("#subs .sub").forEach(s=>{s.style.display=(on && !s.dataset.s)?"none":"";});});
}
function closeDrawer(){
  drawer.classList.remove("on"); scrim.classList.remove("on"); drawer.setAttribute("aria-hidden","true"); document.body.classList.remove("lock");
  if(lastFocus) lastFocus.focus();
}
document.getElementById("dClose").addEventListener("click",closeDrawer);
scrim.addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{
  if(!drawer.classList.contains("on")) return;
  if(e.key==="Escape") closeDrawer();
  if(e.key==="Tab"){const f=[...drawer.querySelectorAll("button:not([disabled])")].filter(x=>x.offsetParent!==null); if(!f.length)return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
document.getElementById("dPrev").addEventListener("click",()=>{const i=ORDER.indexOf(current); if(i>0) openClause(ORDER[i-1]);});
document.getElementById("dNext").addEventListener("click",()=>{const i=ORDER.indexOf(current); if(i<ORDER.length-1) openClause(ORDER[i+1]);});

/* ---------- language ---------- */
function applyLang(){
  const u=U();
  document.documentElement.lang = L;
  document.documentElement.dir = rtl() ? "rtl" : "ltr";
  document.title = L==="ar" ? "ISO 9001:2026 | دليل تفاعلي — مدثر سلامه" : "ISO 9001:2026 | Interactive Guide — Modather Salama";
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
  set("brandName",u.brand); set("brandBy",u.by); set("langLabel",u.switch);
  document.getElementById("langBtn").setAttribute("aria-label",u.switchAria);
  set("stdSub",u.subtitle); set("heroH1",u.h1); set("heroLede",u.lede); set("heroTag",u.tag);
  set("heroPrep",u.prep); set("heroName", L==="ar"?"مدثر سلامه":"Modather Salama");
  set("wheelTitle",u.wheelTitle); set("wheelSub",u.wheelSub); set("hintTxt",u.hint);
  set("changesTitle",u.changesTitle); set("changesSub",u.changesSub);
  set("glossTitle",u.glossTitle); set("glossSub",u.glossSub);
  set("annexTitle",u.annexTitle); set("annexSub",u.annexSub);
  set("transTitle",u.transTitle); set("transNote",u.transNote);
  set("footName",u.footName); set("footTxt",u.foot);
  document.getElementById("q").placeholder=u.searchPh;
  document.getElementById("q").value=""; document.getElementById("results").innerHTML="";
  const ids=["#wheel","#changes","#glossary","#annex","#transition"];
  document.getElementById("nav").innerHTML=u.nav.map((t,i)=>`<a href="${ids[i]}">${t}</a>`).join("");
  buildWheel(); buildLegend(); buildIndex(); buildSearch(); buildChanges(); buildGlossary(); buildPairs(); buildTimeline();
  if(drawer.classList.contains("on") && current) openClause(current,null,true);
}
function switchLang(){L = L==="en" ? "ar" : "en"; applyLang();}
document.getElementById("langBtn").addEventListener("click",switchLang);
document.getElementById("dLang").addEventListener("click",switchLang);
applyLang();
</script>
</body>
</html>
