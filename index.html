<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISO 9001:2026 | Interactive Guide — Modather Salama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F3F7FB; --surface:#FFFFFF; --ink:#1B2A4A; --ink-soft:#4B5874; --muted:#7A869E; --line:#DCE4EE;
  --gold:#B8901E; --gold-tint:#FBF4DF;
  --plan:#1E8C93; --plan-t:#E3F4F4; --do:#3563C9; --do-t:#E7EEFB; --check:#C9821A; --check-t:#FCF1DE;
  --act:#3C9A5F; --act-t:#E5F4EA; --lead:#1B2A4A; --lead-t:#E6EAF2; --ctx:#7B5BB8; --ctx-t:#EFEAF8;
  --new:#C2410C; --new-t:#FDECE3;
  --radius-lg:22px; --radius:14px; --radius-sm:9px;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
html[lang="en"]{--display:"Fraunces",Georgia,serif;--body:"IBM Plex Sans","Segoe UI",Helvetica,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.8}
html[lang="en"] body{font-size:16px;line-height:1.65}
img,svg{max-width:100%}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:22px}

.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--ink);display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:13px}
.brand b{font-family:var(--display);font-size:15px;display:block;line-height:1.4}
.brand span{font-size:13px;color:var(--muted)}
.bar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:var(--ink-soft);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:999px}
.nav a:hover{background:var(--bg);color:var(--ink)}
.lang{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600;cursor:pointer}
.lang:hover{background:#27395f}
.lang svg{flex:none}

.hero{padding:44px 0 18px}
.hero-grid{display:grid;gap:10px;text-align:center}
.std-code{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(44px,7vw,78px);line-height:1;letter-spacing:-1px;direction:ltr}
.std-code small{display:block;font-size:.26em;letter-spacing:0;color:var(--gold);font-weight:400;margin-top:10px;font-family:var(--body)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,38px);margin:14px 0 4px;line-height:1.4}
html[lang="en"] .hero h1{font-weight:700}
.hero .lede{max-width:64ch;margin:0 auto;color:var(--ink-soft);font-size:17px}
.edition-tag{display:inline-flex;align-items:center;gap:10px;margin:16px auto 0;background:var(--gold-tint);border:1px solid #EFDFAF;color:#7A5E10;padding:7px 16px;border-radius:999px;font-weight:600;font-size:14.5px}
.edition-tag i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.author{margin-top:14px;font-size:15px;color:var(--muted)}
.author strong{color:var(--ink);font-family:var(--display);font-size:18px;margin-inline-start:6px}

.stage{background:var(--surface);border:1px solid var(--line);border-radius:28px;margin-top:26px;padding:22px 18px 18px;position:relative;overflow:hidden}
.stage-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:0 8px 6px}
.stage-head h2{font-family:var(--display);font-size:22px;margin:0}
.stage-head p{margin:0;color:var(--ink-soft);font-size:15px}
.hint{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft);background:var(--bg);border-radius:999px;padding:6px 14px}
#pdca{display:block;width:100%;height:auto;max-height:640px;margin-inline:auto}
#pdca .seg{cursor:pointer;transition:transform .25s ease, filter .25s ease;transform-origin:450px 320px}
#pdca .seg:hover,#pdca .seg:focus-visible{transform:scale(1.035);filter:drop-shadow(0 8px 14px rgba(27,42,74,.18))}
#pdca .seg:focus{outline:none}
#pdca .seg:focus-visible .seg-shape{stroke:var(--gold);stroke-width:4}
#pdca text{font-family:var(--body);pointer-events:none}
#pdca .num{font-family:Georgia,serif;font-weight:700}
.pulse{animation:pulse 2.4s ease-in-out 1s 3}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.2}}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;padding:8px 0 4px;font-size:14px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:4px}

.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:16px}
.index button{all:unset;cursor:pointer;background:var(--bg);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:center;border:1px solid transparent;transition:border-color .2s, background .2s}
.index button:hover{background:#fff;border-color:var(--line)}
.index button:focus-visible{outline:3px solid var(--gold)}
.index .n{font-family:Georgia,serif;font-weight:700;font-size:26px;line-height:1;min-width:30px;text-align:center}
.index .t{font-size:14.5px;font-weight:600;line-height:1.45}

.search{margin-top:18px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:14px 16px;padding-inline-start:48px;border-radius:var(--radius);border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--plan);box-shadow:0 0 0 4px var(--plan-t)}
.search > svg{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.results{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.results button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:baseline;width:100%;box-sizing:border-box;padding:10px 14px;border-radius:var(--radius-sm);background:#fff;border:1px solid var(--line)}
.results button:hover{border-color:var(--plan)}
.results .rn{font-family:Georgia,serif;font-weight:700;color:var(--plan);direction:ltr;min-width:56px}
.results .rt{font-weight:600}
.results .rs{color:var(--muted);font-size:13.5px}
.results .empty{padding:10px 14px;color:var(--ink-soft);background:#fff;border-radius:var(--radius-sm)}

section.block{padding:54px 0 10px}
.sec-title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.sec-title h2{font-family:var(--display);font-size:clamp(22px,2.6vw,30px);margin:0;line-height:1.4}
.sec-title p{margin:0;color:var(--ink-soft);max-width:72ch}
.rule{height:3px;width:56px;background:var(--gold);border-radius:3px;margin-bottom:10px}

.changes{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.change{background:var(--surface);border-radius:var(--radius-lg);padding:22px;border:1px solid var(--line);display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.change .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.change h3{margin:0 0 4px;font-size:17.5px;font-family:var(--display);line-height:1.45}
.change p{margin:0;color:var(--ink-soft);font-size:15px}
.change .refs{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--ink-soft);direction:ltr;cursor:pointer;border:0}
.chip:hover{background:var(--plan-t);color:var(--plan)}

.gl-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.gl-tools input{flex:1;min-width:220px;font:inherit;padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--line)}
.gl-tools input:focus{outline:none;border-color:var(--plan);box-shadow:0 0 0 4px var(--plan-t)}
.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.term{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.term header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.term h4{margin:0;font-size:17px;font-family:var(--display)}
.term .en{direction:ltr;font-family:Georgia,serif;color:var(--plan);font-size:15px}
.term .ref{font-size:12px;color:var(--muted);direction:ltr}
.term p{margin:6px 0 0;color:var(--ink-soft);font-size:15px}

.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.pair{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--line);overflow:hidden}
.pair h3{margin:0;padding:14px 20px;font-size:16px;font-family:var(--display);background:var(--bg);border-bottom:1px solid var(--line)}
.pair dl{margin:0;padding:6px 20px 16px}
.pair dt{font-weight:700;margin-top:10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pair dt span{direction:ltr;font-family:Georgia,serif;color:var(--gold);font-weight:400;font-size:14.5px}
.pair dd{margin:2px 0 0;color:var(--ink-soft);font-size:15px}

.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));background:#fff;border-radius:var(--radius-lg);border:1px solid var(--line);overflow:hidden}
.timeline li{padding:22px 20px;border-inline-start:1px solid var(--line)}
.timeline li:first-child{border-inline-start:0}
.timeline .when{font-family:var(--display);font-weight:700;font-size:18px;color:var(--plan)}
.timeline .what{color:var(--ink-soft);font-size:15px}
.timeline .step{width:30px;height:30px;border-radius:50%;background:var(--plan-t);color:var(--plan);display:grid;place-items:center;font-weight:700;font-size:14px;margin-bottom:8px}
.note{margin-top:14px;background:var(--gold-tint);border-inline-start:4px solid var(--gold);padding:12px 16px;border-radius:var(--radius-sm);font-size:15px;color:#5E4A12}

footer{margin-top:60px;background:var(--surface);border-top:1px solid var(--line);padding:28px 0 34px;font-size:14px;color:var(--muted)}
footer .wrap{display:grid;gap:10px}
footer strong{color:var(--ink);font-family:var(--display);font-size:16px}

.scrim{position:fixed;inset:0;background:rgba(27,42,74,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(820px,100%);background:var(--bg);z-index:50;transform:translateX(-104%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(27,42,74,.18)}
html[dir="rtl"] .drawer{transform:translateX(104%)}
.drawer.on{transform:none}
.d-head{padding:22px 26px 20px;color:#fff;position:relative}
.d-head .row{display:flex;gap:18px;align-items:center}
.d-num{font-family:Georgia,serif;font-weight:700;font-size:64px;line-height:.9}
.d-phase{display:inline-block;font-size:13px;font-weight:600;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:999px;margin-bottom:4px}
.d-title{font-family:var(--display);font-size:clamp(20px,3vw,28px);margin:0;line-height:1.35}
.d-lang{position:absolute;inset-inline-end:68px;top:18px;height:40px;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;padding:0 14px;font-size:13.5px;font-weight:600}
.d-lang:hover{background:rgba(255,255,255,.3)}
.d-close{position:absolute;inset-inline-end:18px;top:18px;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;display:grid;place-items:center}
.d-close:hover{background:rgba(255,255,255,.3)}
.d-body{overflow-y:auto;padding:22px 26px 30px;flex:1}
.d-intro{font-size:16.5px;color:var(--ink-soft);margin:0 0 16px}
.illo{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;margin:0 0 18px;overflow-x:auto}
.illo figcaption{font-size:13.5px;color:var(--muted);text-align:center;margin-top:6px}
.illo svg{display:block;width:100%;height:auto}
.illo svg text{font-family:var(--body)}
.d-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.d-tools .count{margin-inline-start:auto;font-size:13.5px;color:var(--muted)}

.sub{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.sub > button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px}
.sub > button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.sub .sn{font-family:Georgia,serif;font-weight:700;direction:ltr;min-width:62px;text-align:center;padding:4px 8px;border-radius:8px;font-size:15px}
.sub .st{font-weight:700;font-size:16px;flex:1;line-height:1.4}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge.new{background:var(--new-t);color:var(--new)}
.badge.upd{background:var(--gold-tint);color:#86680F}
.chev{transition:transform .25s;color:var(--muted);flex:none}
.sub.open .chev{transform:rotate(180deg)}
.sub-body{display:none;padding:0 16px 16px}
.sub.open .sub-body{display:block}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pane{border-radius:12px;padding:14px 16px}
.pane h5{margin:0 0 6px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:var(--display)}
.pane p{margin:0;font-size:15.5px}
.pane.req{background:var(--bg);grid-column:1/-1}
.pane.ex{background:var(--act-t)} .pane.ex h5{color:var(--act)}
.pane.how{background:var(--do-t)} .pane.how h5{color:var(--do)}
.pane ol{margin:0;padding-inline-start:0;list-style:none;counter-reset:s}
.pane ol li{counter-increment:s;position:relative;padding-inline-start:32px;margin-bottom:6px;font-size:15px;line-height:1.6}
.pane ol li::before{content:counter(s);position:absolute;inset-inline-start:0;top:2px;width:22px;height:22px;border-radius:50%;background:var(--do);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.pane.ev{grid-column:1/-1;background:var(--check-t)} .pane.ev h5{color:#9A6210}
.ev-list{display:flex;flex-wrap:wrap;gap:6px}
.ev-list span{background:#fff;border-radius:8px;padding:4px 10px;font-size:14px;border:1px solid #F2DDB6}
.tip{grid-column:1/-1;background:var(--gold-tint);border-inline-start:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px;color:#5E4A12}
.d-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 26px;border-top:1px solid var(--line);background:#fff}
.d-foot button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;cursor:pointer;font-size:14.5px;color:var(--ink)}
.d-foot button:hover{border-color:var(--ink-soft)}
.d-foot button[disabled]{opacity:.4;cursor:default}
body.lock{overflow:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:720px){
  .panes{grid-template-columns:1fr}
  .d-head,.d-body{padding-inline:18px}
  .d-num{font-size:48px}
  .illo svg{min-width:560px}
  .nav{display:none}
  .timeline li{border-inline-start:0;border-top:1px solid var(--line)}
  .timeline li:first-child{border-top:0}
}
@media print{.topbar,.search,.scrim,.drawer,.hint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">9001</div>
      <div><b id="brandName"></b><span id="brandBy"></span></div>
    </div>
    <div class="bar-right">
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <button class="lang" id="langBtn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.8 2.5 15 0 18M12 3c-2.5 2.8-2.5 15 0 18"/></svg>
        <span id="langLabel"></span>
      </button>
    </div>
  </div>
</header>

<main>
<div class="wrap">
  <div class="hero">
    <div class="hero-grid">
      <div class="std-code">ISO 9001:2026<small id="stdSub"></small></div>
      <h1 id="heroH1"></h1>
      <p class="lede" id="heroLede"></p>
      <div><span class="edition-tag"><i></i><span id="heroTag"></span></span></div>
      <div class="author"><span id="heroPrep"></span> <strong id="heroName"></strong></div>
    </div>
  </div>

  <div class="stage" id="wheel">
    <div class="stage-head">
      <div><h2 id="wheelTitle"></h2><p id="wheelSub"></p></div>
      <span class="hint"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11V5a2 2 0 1 1 4 0v6"/><path d="M13 10a2 2 0 1 1 4 0v2a7 7 0 0 1-7 7h-.5A5.5 5.5 0 0 1 4 13.5V12a2 2 0 1 1 4 0"/></svg><span id="hintTxt"></span></span>
    </div>
    <svg id="pdca" viewBox="0 0 900 640" role="group" aria-label="PDCA cycle"></svg>
    <div class="legend" id="legend" aria-hidden="true"></div>
    <div class="index" id="index"></div>
    <div class="search">
      <label for="q" class="sr">Search</label>
      <input id="q" type="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <ul class="results" id="results" aria-live="polite"></ul>
    </div>
  </div>
</div>

<section class="block" id="changes"><div class="wrap">
  <div class="rule"></div>
  <div class="sec-title"><h2 id="changesTitle"></h2><p id="changesSub"></p></div>
  <div class="changes" id="changeList"></div>
</div></section>

<section class="block" id="glossary"><div class="wrap">
  <div class="rule"></div>
  <div class="sec-title"><h2 id="glossTitle"></h2><p id="glossSub"></p></div>
  <div class="gl-tools"><input id="gq" type="search" aria-label="Search terms"></div>
  <div class="glossary" id="glist"></div>
</div></section>

<section class="block" id="annex"><div class="wrap">
  <div class="rule"></div>
  <div class="sec-title"><h2 id="annexTitle"></h2><p id="annexSub"></p></div>
  <div class="pairs" id="pairs"></div>
</div></section>

<section class="block" id="transition"><div class="wrap">
  <div class="rule"></div>
  <div class="sec-title"><h2 id="transTitle"></h2></div>
  <ol class="timeline" id="timeline"></ol>
  <p class="note" id="transNote"></p>
</div></section>
</main>

<footer><div class="wrap"><div><strong id="footName"></strong></div><div id="footTxt"></div></div></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <div class="d-head" id="dHead">
    <div class="row"><div class="d-num" id="dNum"></div>
      <div><span class="d-phase" id="dPhase"></span><h2 class="d-title" id="dTitle"></h2></div></div>

<script>
const DATA = {"clauses": [{"id": "4", "phase": "ctx", "illo": "context", "ar": {"title": "سياق المنظمة", "short": "السياق", "intro": "قبل بناء النظام، افهم البيئة التي تعمل فيها: ما القضايا التي تؤثر عليك، ومن الأطراف المهتمة بعملك، وما حدود النظام. كل ما يأتي بعد ذلك يُبنى على هذا الفهم."}, "en": {"title": "Context of the organization", "short": "Context", "intro": "Before you build the system, understand the environment you operate in: which issues affect you, who has a stake in your work, and where the system's boundaries lie. Everything that follows is built on this understanding."}, "subs": [{"n": "4.1", "s": "upd", "ar": {"t": "فهم المنظمة وسياقها", "req": "حدِّد القضايا الداخلية والخارجية المرتبطة بغرض المنظمة واتجاهها الاستراتيجي والمؤثرة على قدرة النظام على تحقيق نتائجه. قرِّر صراحة هل تغيّر المناخ قضية ذات صلة أم لا، وتابع معلومات هذه القضايا وراجعها باستمرار. القضايا قد تكون إيجابية أو سلبية.", "ex": "حددت شركة الأفق قضايا خارجية مثل: توسع مشاريع الشبكة ضمن رؤية 2030، اشتراطات المحتوى المحلي، تذبذب أسعار النحاس. وقضايا داخلية مثل: دوران العمالة الفنية وضعف الرقمنة. وقررت أن تغيّر المناخ قضية ذات صلة، لأن موجات الحر تخفض إنتاجية المواقع وتؤثر على اختيار الكابلات والمعدات.", "how": ["عقد ورشة تحليل PESTLE وSWOT مع الإدارة العليا ورؤساء الأقسام.", "تسجيل قرار موثق ومبرَّر بشأن تغير المناخ، سواء كانت النتيجة نعم أو لا.", "ربط كل قضية مهمة بخطر أو فرصة في سجل البند 6.1.", "مراجعة التحليل دورياً، وفي مراجعة الإدارة، وعند أي تغيير كبير."], "ev": ["تحليل SWOT / PESTLE محدَّث", "قرار تغير المناخ ومبرراته", "محاضر المراجعة الدورية"], "tip": "غياب قرار المناخ نفسه يُعد عدم مطابقة، حتى لو كانت الإجابة الصحيحة أنه غير ذي صلة."}, "en": {"t": "Understanding the organization and its context", "req": "Determine the internal and external issues relevant to your purpose and strategic direction that affect the system's ability to achieve its intended results. Decide explicitly whether climate change is a relevant issue, and keep monitoring and reviewing information about these issues. Issues can be positive or negative.", "ex": "Al-Ufuq Electrical identified external issues such as grid expansion under Vision 2030, local content requirements and copper price volatility; and internal issues such as turnover among skilled technicians and limited digitalization. It concluded that climate change is relevant, because heat waves reduce site productivity and influence cable and equipment selection.", "how": ["Run a PESTLE and SWOT workshop with top management and department heads.", "Record a documented, justified decision on climate change, whether the answer is yes or no.", "Link every significant issue to a risk or an opportunity in the 6.1 registers.", "Review the analysis periodically, at management review, and after any major change."], "ev": ["Current SWOT / PESTLE analysis", "Climate change decision with its rationale", "Minutes of periodic reviews"], "tip": "The absence of a climate decision is itself a nonconformity, even when the correct answer is that it is not relevant."}}, {"n": "4.2", "s": "upd", "ar": {"t": "فهم احتياجات وتوقعات الأطراف المعنية", "req": "حدِّد الأطراف المعنية ذات الصلة بالنظام، ومتطلباتها ذات الصلة، ثم قرِّر أيّ هذه المتطلبات ستعالجها من خلال النظام. تابع التغيرات في هذه الأطراف ومتطلباتها، مع ملاحظة أن بعضها قد يرتبط بتغير المناخ.", "ex": "العميل الرئيسي لـشركة الأفق شركة كهرباء وطنية تشترط تأهيل المقاولين وخطط جودة للمشاريع. الاستشاري يطلب طلبات فحص قبل كل مرحلة. الموظفون يتوقعون بيئة عمل آمنة. قررت الشركة معالجة متطلبات الجودة داخل النظام، ومتطلبات السلامة ضمن نظام ISO 45001.", "how": ["حصر الأطراف: العملاء، الاستشاريون، الجهات التنظيمية، الموردون، المقاولون الباطن، الموظفون، الملاك، المجتمع.", "تحديد متطلبات كل طرف ومصدرها (عقد، نظام، توقع معتاد).", "تحديد ما سيعالجه النظام، ومن المسؤول، وأين يظهر في العمليات.", "تحديث السجل عند توقيع عقد جديد أو صدور نظام جديد."], "ev": ["سجل الأطراف المعنية ومتطلباتها", "طريقة معالجة كل متطلب", "دليل التحديث"], "tip": ""}, "en": {"t": "Understanding the needs and expectations of interested parties", "req": "Determine which interested parties are relevant to the system and what their relevant requirements are, then decide which of those requirements will be addressed through the system. Monitor changes in these parties and their requirements; some may relate to climate change.", "ex": "Al-Ufuq Electrical's main client is a national utility that requires contractor pre-qualification and project quality plans. The consultant requires inspection requests before each stage. Employees expect a safe workplace. The company addresses the quality requirements inside the QMS and the safety requirements through its ISO 45001 system.", "how": ["List the parties: clients, consultants, regulators, suppliers, subcontractors, employees, owners, community.", "Capture each party's requirements and their source (contract, regulation, common expectation).", "Decide what the QMS will address, who owns it, and where it appears in the processes.", "Update the register whenever a new contract is signed or a new regulation is issued."], "ev": ["Interested parties register with requirements", "How each requirement is addressed", "Evidence of updates"], "tip": ""}}, {"n": "4.3", "s": "", "ar": {"t": "تحديد نطاق نظام إدارة الجودة", "req": "حدِّد حدود النظام ومجال تطبيقه، مع مراعاة السياق ومتطلبات الأطراف ومنتجاتك وخدماتك. طبِّق كل المتطلبات القابلة للتطبيق داخل النطاق. يجب أن يذكر النطاق أنواع المنتجات والخدمات، وأن يبرر أي متطلب غير قابل للتطبيق، وأن يكون موثقاً. ولا يصح ادعاء المطابقة إذا كان الاستثناء يمس القدرة على ضمان المطابقة أو رضا العملاء.", "ex": "نطاق شركة الأفق: تصميم وتوريد وتنفيذ محطات التحويل وخطوط النقل الهوائية، في المكتب الرئيسي بالرياض ومواقع المشاريع. لا تستثني الشركة بند التصميم لأنها تصمم. في المقابل، شركة تركيب تنفذ تصاميم العميل فقط يمكنها استثناء البند 8.3 بمبرر واضح.", "how": ["تحديد المنتجات والخدمات والمواقع والأنشطة المشمولة.", "مراجعة كل بند للتأكد من قابليته للتطبيق.", "كتابة مبرر لكل بند غير قابل للتطبيق.", "اعتماد وثيقة النطاق ونشرها، وتطابقها مع الشهادة."], "ev": ["وثيقة النطاق المعتمدة", "مبررات عدم التطبيق", "قائمة المواقع المشمولة"], "tip": ""}, "en": {"t": "Determining the scope of the quality management system", "req": "Define the boundaries and applicability of the system, considering the context, interested party requirements, and your products and services. Apply every requirement that is applicable within that scope. The scope must state the types of products and services, justify any requirement determined not applicable, and be available as documented information. Conformity cannot be claimed if an exclusion affects your ability to ensure conformity or enhance customer satisfaction.", "ex": "Al-Ufuq Electrical's scope: design, supply and construction of substations and overhead transmission lines, covering the Riyadh head office and project sites. Design is not excluded because the company designs. By contrast, an installation-only contractor working to client drawings could exclude 8.3 with a clear justification.", "how": ["Define the products, services, sites and activities covered.", "Review each requirement for applicability.", "Write a justification for every requirement determined not applicable.", "Approve and publish the scope, and keep it aligned with the certificate."], "ev": ["Approved scope statement", "Justifications for non-applicability", "List of sites covered"], "tip": ""}}, {"n": "4.4.1", "s": "", "ar": {"t": "نظام إدارة الجودة وعملياته", "req": "أنشئ النظام ونفّذه وحافظ عليه وحسّنه، بما فيه العمليات وتفاعلاتها. لكل عملية: حدِّد المدخلات والمخرجات، والتسلسل والتفاعل، والمعايير والطرق والمؤشرات، والموارد، والمسؤوليات، والمخاطر والفرص، ثم قيّمها وعدّلها وحسّنها.", "ex": "رسمت شركة الأفق خريطة عمليات من ثلاثة مستويات: إدارية (التخطيط، مراجعة الإدارة)، رئيسية (المناقصات، التصميم، المشتريات، التنفيذ، التسليم)، مساندة (الموارد البشرية، المعدات، الوثائق). بطاقة عملية المشتريات مثلاً: المدخل طلب مواد، والمخرج أمر شراء، والمؤشر نسبة التوريد في الموعد لا تقل عن 90%.", "how": ["حصر العمليات ورسم خريطة التفاعل بينها.", "إعداد بطاقة لكل عملية (SIPOC أو Turtle Diagram).", "تحديد مالك ومؤشرات أداء لكل عملية.", "مراجعة أداء العمليات دورياً وتعديلها عند الحاجة."], "ev": ["خريطة العمليات", "بطاقات وصف العمليات", "مؤشرات الأداء ونتائجها"], "tip": ""}, "en": {"t": "Quality management system and its processes", "req": "Establish, implement, maintain and continually improve the system, including its processes and their interactions. For each process determine inputs and outputs, sequence and interaction, criteria, methods and performance indicators, resources, responsibilities, and risks and opportunities; then evaluate, change and improve it.", "ex": "Al-Ufuq Electrical mapped its processes on three levels: management (planning, management review), core (tendering, design, procurement, construction, handover) and support (HR, equipment, documents). The procurement process card, for example: input is a material request, output is a purchase order, indicator is on-time delivery of at least 90%.", "how": ["List the processes and map how they interact.", "Build a process card for each one (SIPOC or turtle diagram).", "Assign an owner and performance indicators to every process.", "Review process performance periodically and adjust as needed."], "ev": ["Process map", "Process description cards", "Performance indicators and results"], "tip": ""}}, {"n": "4.4.2", "s": "", "ar": {"t": "المعلومات الموثقة للعمليات", "req": "وفّر المعلومات الموثقة بالقدر الذي يدعم تشغيل العمليات، ويثبت أنها نُفذت كما خُطط لها.", "ex": "لدى شركة الأفق إجراء مراجعة العقود (لدعم التشغيل)، ونموذج مراجعة مكتمل وموقّع لكل مناقصة (كدليل على التنفيذ).", "how": ["تحديد العمليات التي تحتاج إجراءً مكتوباً حسب تعقيدها.", "تحديد السجلات التي تثبت التنفيذ.", "ربطها بنظام ضبط الوثائق في البند 7.5."], "ev": ["إجراءات وتعليمات عمل", "سجلات تنفيذ مكتملة"], "tip": ""}, "en": {"t": "Documented information for the processes", "req": "Make documented information available to the extent needed to support the operation of the processes and to give evidence that they are carried out as planned.", "ex": "Al-Ufuq Electrical keeps a contract review procedure (to support operation) and a completed, signed review form for every tender (as evidence of execution).", "how": ["Decide which processes need a written procedure, based on their complexity.", "Decide which records prove execution.", "Connect them to the document control system in 7.5."], "ev": ["Procedures and work instructions", "Completed execution records"], "tip": ""}}]}, {"id": "5", "phase": "lead", "illo": "leadership", "ar": {"title": "القيادة", "short": "القيادة", "intro": "الإدارة العليا هي محرك النظام. المطلوب ليس توقيع السياسة فقط، بل قيادة واضحة ومساءلة وسلوك يعكس ثقافة الجودة والأخلاقيات."}, "en": {"title": "Leadership", "short": "Leadership", "intro": "Top management drives the system. What is required is not a signature on the policy, but visible leadership, accountability, and behaviour that reflects quality culture and ethics."}, "subs": [{"n": "5.1.1", "s": "new", "ar": {"t": "القيادة والالتزام", "req": "تُثبت الإدارة العليا قيادتها من خلال: سياسة وأهداف متوافقة مع الاستراتيجية، دمج النظام في عمليات الأعمال، توفير الموارد، التواصل حول أهمية الجودة، ضمان تحقيق النتائج، دعم الأفراد والقادة، تعزيز التحسين والنهج بالعمليات، تعزيز التفكير القائم على المخاطر والتفكير القائم على الفرص، تعزيز ثقافة الجودة والسلوك الأخلاقي، وتحمّل المساءلة عن فعالية النظام.", "ex": "الرئيس التنفيذي لـشركة الأفق يفتتح اجتماع الجودة الشهري، وأطلق جائزة ربعية لأفضل موقع في الجودة، واعتمد ميثاقاً يمنع التلاعب في نتائج الفحص. وعندما ضغط أحد المشاريع لتسليم أعمال غير مطابقة، أوقف التسليم حتى تُعالج.", "how": ["اعتماد ميثاق قيم وأخلاقيات مرتبط بالجودة.", "رسائل وزيارات ميدانية منتظمة من الإدارة العليا.", "قياس الثقافة: استبيان سنوي، وعدد البلاغات الطوعية عن الأخطاء.", "عرض نتائج الثقافة والمساءلة في مراجعة الإدارة."], "ev": ["مقابلة الإدارة العليا", "قرارات ورسائل موثقة", "مبادرات ثقافة الجودة", "ميثاق الأخلاقيات"], "tip": "المدقق سيبحث عن سلوك قيادي ملموس، ثم يتحقق من أثره في مقابلات الموظفين ضمن البند 7.3."}, "en": {"t": "Leadership and commitment", "req": "Top management demonstrates leadership through: a policy and objectives aligned with strategy, integration of the QMS into business processes, provision of resources, communicating the importance of quality, ensuring intended results are achieved, supporting people and other leaders, promoting improvement and the process approach, promoting risk-based and opportunity-based thinking, promoting quality culture and ethical behaviour, and taking accountability for the system's effectiveness.", "ex": "The CEO of Al-Ufuq Electrical opens the monthly quality meeting, launched a quarterly award for the best site on quality, and approved a charter prohibiting any manipulation of test results. When one project pushed to hand over non-conforming work, he stopped the handover until it was corrected.", "how": ["Approve a values and ethics charter tied to quality.", "Regular messages and site visits from top management.", "Measure culture: an annual survey and the number of voluntarily reported errors.", "Present culture and accountability results at management review."], "ev": ["Top management interview", "Documented decisions and messages", "Quality culture initiatives", "Ethics charter"], "tip": "Auditors look for tangible leadership behaviour, then test its effect through employee interviews under 7.3."}}, {"n": "5.1.2", "s": "", "ar": {"t": "التركيز على العميل", "req": "تتأكد القيادة من أن متطلبات العملاء والتشريعات محددة ومفهومة ومستوفاة باستمرار، وأن المخاطر والفرص المؤثرة على المطابقة والرضا محددة ومعالجة، وأن التركيز على رفع رضا العملاء قائم.", "ex": "تراجع إدارة شركة الأفق شهرياً مؤشر رضا العميل، وملاحظات الاستشاري، وحالة الشكاوى المفتوحة لكل مشروع.", "how": ["سجل متطلبات العملاء والتشريعات لكل مشروع.", "مؤشر رضا يُعرض على الإدارة دورياً.", "متابعة الشكاوى حتى الإغلاق."], "ev": ["مؤشرات رضا العملاء", "سجل الشكاوى", "سجل المتطلبات التشريعية"], "tip": ""}, "en": {"t": "Customer focus", "req": "Top management ensures that customer and applicable statutory and regulatory requirements are determined, understood and consistently met; that risks and opportunities affecting conformity and customer satisfaction are determined and addressed; and that the focus on enhancing customer satisfaction is maintained.", "ex": "Al-Ufuq Electrical's management reviews the customer satisfaction indicator, consultant remarks and the status of open complaints for each project every month.", "how": ["Keep a register of customer and regulatory requirements per project.", "Report a satisfaction indicator to management regularly.", "Track complaints through to closure."], "ev": ["Customer satisfaction indicators", "Complaints log", "Register of statutory requirements"], "tip": ""}}, {"n": "5.2.1", "s": "upd", "ar": {"t": "وضع سياسة الجودة", "req": "تضع الإدارة العليا سياسة جودة: مناسبة لغرض المنظمة، تشكل إطاراً للأهداف، تلتزم بالوفاء بالمتطلبات وبالتحسين المستمر، وتراعي السياق وتدعم الاتجاه الاستراتيجي.", "ex": "سياسة شركة الأفق تلتزم بتسليم مشاريع مطابقة لمتطلبات العملاء والأنظمة السعودية في موعدها، وبالتحسين المستمر، وتنسجم مع رؤية الشركة في التوسع بمشاريع الطاقة المتجددة.", "how": ["صياغة السياسة بمشاركة الإدارة العليا.", "التحقق من وجود الالتزامين: المتطلبات والتحسين.", "ربط السياسة بالاستراتيجية والسياق.", "مراجعتها في مراجعة الإدارة."], "ev": ["سياسة معتمدة ومؤرخة", "اتساقها مع الاستراتيجية"], "tip": ""}, "en": {"t": "Establishing the quality policy", "req": "Top management establishes a quality policy that is appropriate to the organization's purpose, provides a framework for objectives, includes commitments to meet applicable requirements and to continual improvement, and takes the context into account while supporting the strategic direction.", "ex": "Al-Ufuq Electrical's policy commits to delivering projects that conform to customer and Saudi regulatory requirements on schedule, and to continual improvement, in line with the company's ambition to expand into renewable energy projects.", "how": ["Draft the policy with top management involved.", "Check both commitments are present: requirements and improvement.", "Link the policy to strategy and context.", "Review it at management review."], "ev": ["Approved, dated policy", "Alignment with the strategy"], "tip": ""}}, {"n": "5.2.2", "s": "", "ar": {"t": "نشر سياسة الجودة", "req": "السياسة موثقة، ومُبلَّغة داخلياً، ومتاحة للأطراف المعنية حسب الحاجة، ومطبقة ومفهومة داخل المنظمة.", "ex": "نشرت شركة الأفق السياسة في المواقع بثلاث لغات يفهمها العاملون، وعلى موقعها الإلكتروني، ويسأل المشرفون الفرق عنها في لقاءات التوعية.", "how": ["نشرها بلغات العاملين.", "إتاحتها للعملاء والموردين.", "التحقق من فهمها بالمقابلات."], "ev": ["لوحات النشر", "الموقع الإلكتروني", "مقابلات الموظفين"], "tip": ""}, "en": {"t": "Communicating the quality policy", "req": "The policy is available as documented information, communicated within the organization, available to interested parties as appropriate, and implemented, understood and applied.", "ex": "Al-Ufuq Electrical posts the policy at its sites in the three languages its workforce reads, publishes it on the website, and supervisors test understanding during awareness sessions.", "how": ["Publish it in the languages your workforce speaks.", "Make it available to customers and suppliers.", "Verify understanding through interviews."], "ev": ["Notice boards", "Website", "Employee interviews"], "tip": ""}}, {"n": "5.3", "s": "upd", "ar": {"t": "الأدوار والمسؤوليات والصلاحيات", "req": "تتأكد الإدارة العليا من تعيين المسؤوليات والصلاحيات وإبلاغها، وتحديداً: مطابقة النظام للمواصفة، رفع تقارير الأداء وفرص التحسين، ضمان نتائج العمليات، تعزيز التركيز على العميل، والحفاظ على سلامة النظام عند تخطيط التغييرات وتنفيذها.", "ex": "عيّنت شركة الأفق مدير الجودة مسؤولاً عن مطابقة النظام والتقارير. وعند دمج إدارتي المشتريات والمخازن، كُلِّف بمراجعة أثر الدمج على الإجراءات والصلاحيات قبل التنفيذ.", "how": ["هيكل تنظيمي وأوصاف وظيفية واضحة.", "مصفوفة مسؤوليات (RACI) للعمليات.", "قرار تعيين مكتوب لمسؤول النظام.", "تكليف صريح بحماية النظام عند التغيير."], "ev": ["الهيكل التنظيمي", "الأوصاف الوظيفية", "مصفوفة RACI", "قرارات التعيين"], "tip": ""}, "en": {"t": "Roles, responsibilities and authorities", "req": "Top management ensures responsibilities and authorities are assigned and communicated, specifically for: conformity of the QMS to the standard, reporting performance and improvement opportunities, ensuring processes deliver intended results, promoting customer focus, and maintaining the integrity of the system when changes are planned and implemented.", "ex": "Al-Ufuq Electrical assigned the quality manager responsibility for system conformity and reporting. When procurement and warehousing were merged, he was tasked with reviewing the impact on procedures and authorities before the change went live.", "how": ["Keep a clear org chart and job descriptions.", "Build a RACI matrix for the processes.", "Issue a written appointment for the system owner.", "Assign explicit responsibility for protecting system integrity during change."], "ev": ["Org chart", "Job descriptions", "RACI matrix", "Appointment letters"], "tip": ""}}]}, {"id": "6", "phase": "plan", "illo": "risk", "ar": {"title": "التخطيط", "short": "التخطيط", "intro": "هنا يتحول فهم السياق إلى خطة: مخاطر تُعالج، وفرص تُستثمر، وأهداف تُقاس، وتغييرات تُدار بشكل منظم. الإصدار الجديد يفصل المخاطر عن الفرص بشكل صريح."}, "en": {"title": "Planning", "short": "Planning", "intro": "This is where context turns into a plan: risks addressed, opportunities pursued, objectives measured, and changes managed in an orderly way. The new edition separates risks from opportunities explicitly."}, "subs": [{"n": "6.1.1", "s": "upd", "ar": {"t": "تحديد المخاطر والفرص", "req": "عند التخطيط، انطلق من قضايا السياق ومتطلبات الأطراف لتحديد المخاطر والفرص التي يلزم معالجتها، من أجل: الثقة في تحقيق نتائج النظام، منع الآثار غير المرغوبة أو تقليلها، التحسين المستمر، وتعزيز الآثار المرغوبة.", "ex": "قضية تذبذب أسعار النحاس عند شركة الأفق تحولت إلى خطر تأخر توريد الكابلات. وقضية التحول الرقمي لدى العميل تحولت إلى فرصة لتقديم طلبات الفحص إلكترونياً.", "how": ["سحب القضايا والمتطلبات من البندين 4.1 و4.2.", "تصنيف كل قضية: خطر، فرصة، أو كلاهما.", "إحالة كل منها إلى السجل المناسب."], "ev": ["ربط واضح بين السياق والسجلات"], "tip": ""}, "en": {"t": "Determining risks and opportunities", "req": "When planning, start from the context issues and interested party requirements to determine the risks and opportunities that need to be addressed in order to: give assurance the system can achieve its intended results, prevent or reduce undesired effects, achieve continual improvement, and enhance desired effects.", "ex": "For Al-Ufuq Electrical, copper price volatility became a risk of late cable delivery, while the client's digital transformation became an opportunity to submit inspection requests electronically.", "how": ["Pull the issues and requirements from 4.1 and 4.2.", "Classify each one as a risk, an opportunity, or both.", "Route each to the appropriate register."], "ev": ["Clear traceability from context to the registers"], "tip": ""}}, {"n": "6.1.2", "s": "new", "ar": {"t": "الإجراءات لمعالجة المخاطر", "req": "حدِّد المخاطر التي قد تؤثر سلباً على قدرتك على تقديم منتجات مطابقة ورفع الرضا، ثم حلّلها وقيّمها. خطّط الإجراءات، وطريقة دمجها في العمليات، وطريقة تقييم فعاليتها. يجب أن يتناسب الإجراء مع حجم الأثر. تشمل المخاطر ما يتعلق بالاضطرابات، وتشمل خيارات المعالجة: التجنب، إزالة المصدر، تغيير الاحتمالية أو العاقبة، المشاركة، أو القبول الواعي.", "ex": "خطر تأخر توريد المحولات عند شركة الأفق: الاحتمالية 4 والأثر 5، أي درجة 20 (مرتفع). الإجراءات: اعتماد موردَين، طلب مبكر، ومتابعة أسبوعية. أما خطر تأخر الأدوات المكتبية فمنخفض، فقُبل مع المراقبة فقط. وأعدت الشركة خطة بديلة عند توقف مورد رئيسي.", "how": ["اعتماد منهجية تقييم (مصفوفة الاحتمالية × الأثر).", "تحليل كل خطر وتقييم درجته.", "وضع إجراء متناسب مع الدرجة، ودمجه في العملية المعنية.", "إعداد سيناريوهات للاضطرابات وخطط استمرارية.", "قياس فعالية الإجراءات وإعادة التقييم."], "ev": ["سجل المخاطر", "منهجية التقييم", "معيار التناسب", "خطط الاستمرارية", "تقييم الفعالية"], "tip": "لا يُشترط منهج رسمي لإدارة المخاطر، لكن يجب أن يكون التحليل والتقييم واضحين. ويمكن الاستعانة بـ ISO 31000."}, "en": {"t": "Actions to address risks", "req": "Determine the risks that could adversely affect your ability to consistently provide conforming products and enhance customer satisfaction, then analyse and evaluate them. Plan the actions, how they will be integrated into your processes, and how their effectiveness will be evaluated. Actions must be proportionate to the potential impact. Risks include those related to disruptions, and treatment options include avoiding the risk, removing its source, changing likelihood or consequence, sharing it, or retaining it by informed decision.", "ex": "At Al-Ufuq Electrical, late delivery of transformers scored likelihood 4 and impact 5, a rating of 20 (high). Actions: two approved suppliers, early ordering and weekly follow-up. Late delivery of office supplies scored low and was retained with monitoring only. The company also prepared a fallback plan for the loss of a key supplier.", "how": ["Adopt an assessment method (likelihood x impact matrix).", "Analyse each risk and evaluate its rating.", "Set an action proportionate to the rating and embed it in the relevant process.", "Develop disruption scenarios and continuity plans.", "Measure the effectiveness of the actions and re-assess."], "ev": ["Risk register", "Assessment methodology", "Proportionality criteria", "Continuity plans", "Effectiveness evaluation"], "tip": "No formal risk management method is required, but the analysis and evaluation must be visible. ISO 31000 can be used for guidance."}}, {"n": "6.1.3", "s": "new", "ar": {"t": "الإجراءات لاستثمار الفرص", "req": "حدِّد الفرص التي قد تؤثر إيجاباً، وحلّلها وقيّمها. خطّط الإجراءات ودمجها وتقييم فعاليتها، بحيث تكون مناسبة لسياق المنظمة وتدعم النتائج المرغوبة. من الأمثلة: ممارسات جديدة، منتجات أو خدمات جديدة، شراكات، تقنيات ناشئة.", "ex": "فرصة لدى شركة الأفق: منصة رقمية لطلبات الفحص تختصر زمن الاعتماد. الخطة: تجربة في مشروع واحد ثم التعميم. مؤشر الفعالية: خفض زمن الاعتماد 30%. وفرصة أخرى: التأهل لمشاريع الطاقة الشمسية.", "how": ["جمع الفرص من السياق والعملاء ونتائج القياس.", "تقييم كل فرصة: القيمة، الجهد، الملاءمة.", "خطة تنفيذ بمسؤول وموعد ومؤشر.", "مراجعة النتائج في التحليل ومراجعة الإدارة."], "ev": ["سجل الفرص", "خطط التنفيذ", "مؤشرات الفعالية"], "tip": ""}, "en": {"t": "Actions to address opportunities", "req": "Determine the opportunities that could have a desired effect, then analyse and evaluate them. Plan the actions, integrate them and evaluate their effectiveness; the actions must suit the organization's context and support the desired results. Examples include new practices, new products or services, partnerships and emerging technologies.", "ex": "An opportunity at Al-Ufuq Electrical: a digital platform for inspection requests that shortens approval time. The plan: pilot on one project, then roll out. Effectiveness indicator: 30% reduction in approval time. A second opportunity: pre-qualifying for solar projects.", "how": ["Collect opportunities from context, customers and measurement results.", "Evaluate each one for value, effort and fit.", "Build an implementation plan with an owner, a date and an indicator.", "Review the results in analysis and at management review."], "ev": ["Opportunity register", "Implementation plans", "Effectiveness indicators"], "tip": ""}}, {"n": "6.2.1", "s": "", "ar": {"t": "أهداف الجودة", "req": "ضع أهداف جودة للوظائف والمستويات والعمليات ذات الصلة. يجب أن تكون: متسقة مع السياسة، قابلة للقياس، مراعية للمتطلبات، مرصودة، مُبلَّغة، محدَّثة، موثقة، ومرتبطة بمطابقة المنتجات ورفع رضا العملاء.", "ex": "هدف لدى شركة الأفق: رفع نسبة قبول طلبات الفحص من أول مرة من 82% إلى 95% بنهاية 2027.", "how": ["اشتقاق الأهداف من السياسة والمخاطر والفرص.", "صياغتها بشكل قابل للقياس مع قيمة حالية ومستهدفة.", "توزيعها على الإدارات والمشاريع.", "متابعتها شهرياً."], "ev": ["سجل الأهداف", "القيم الحالية والمستهدفة", "تقارير المتابعة"], "tip": ""}, "en": {"t": "Quality objectives", "req": "Establish quality objectives at relevant functions, levels and processes. They must be consistent with the policy, measurable, take applicable requirements into account, be monitored, communicated, updated as appropriate, available as documented information, and relevant to product conformity and customer satisfaction.", "ex": "An objective at Al-Ufuq Electrical: raise first-time acceptance of inspection requests from 82% to 95% by the end of 2027.", "how": ["Derive objectives from the policy, risks and opportunities.", "State them measurably, with a baseline and a target.", "Cascade them to departments and projects.", "Track them monthly."], "ev": ["Objectives register", "Baseline and target values", "Progress reports"], "tip": ""}}, {"n": "6.2.2", "s": "", "ar": {"t": "التخطيط لتحقيق الأهداف", "req": "لكل هدف حدِّد: ماذا سيُنفَّذ، والموارد اللازمة، والمسؤول، وموعد الإنجاز، وطريقة تقييم النتائج.", "ex": "لتحقيق هدف قبول الفحص: تدريب المشرفين واعتماد قوائم تحقق ذاتي (ماذا)، مدرب وميزانية (الموارد)، مدير الجودة (المسؤول)، الربع الثاني (الموعد)، تقرير شهري بالنسبة (التقييم).", "how": ["جدول خطة لكل هدف بالعناصر الخمسة.", "ربط الموارد بالميزانية.", "مراجعة التقدم دورياً."], "ev": ["خطة عمل لكل هدف"], "tip": ""}, "en": {"t": "Planning to achieve the objectives", "req": "For each objective determine what will be done, what resources are required, who is responsible, when it will be completed, and how the results will be evaluated.", "ex": "To reach the inspection acceptance target: train supervisors and introduce self-check lists (what), a trainer and a budget (resources), the quality manager (who), Q2 (when), a monthly percentage report (evaluation).", "how": ["Build a plan table per objective covering the five elements.", "Tie the resources to the budget.", "Review progress periodically."], "ev": ["Action plan for each objective"], "tip": ""}}, {"n": "6.3", "s": "upd", "ar": {"t": "تخطيط التغييرات", "req": "عند الحاجة لتغيير النظام، نفّذه بشكل مخطط، مع مراعاة: الغرض والعواقب المحتملة، الأثر على سلامة النظام، توافر الموارد والمعلومات، توزيع المسؤوليات والصلاحيات، إبلاغ التغيير، كيفية رصد فعاليته وتقييمها، وكيفية مراجعة نتائجه.", "ex": "انتقلت شركة الأفق من الأرشفة الورقية إلى نظام إلكتروني للوثائق. خطة التغيير شملت: الغرض، الأثر على ضبط الوثائق، الموارد، تعيين مسؤول النظام، إبلاغ الفرق وتدريبها، مؤشر زمن الوصول للوثيقة، ومراجعة بعد ثلاثة أشهر.", "how": ["نموذج طلب تغيير يغطي الاعتبارات السبعة.", "تقييم الأثر على الإجراءات والصلاحيات قبل الاعتماد.", "خطة تواصل وتدريب.", "مراجعة ما بعد التنفيذ وتوثيق الدروس."], "ev": ["نماذج طلب وخطة التغيير", "تقييم الأثر", "مراجعة ما بعد التنفيذ"], "tip": "إرشادات إدارة التغيير المؤسسي متاحة في ISO/TS 10020."}, "en": {"t": "Planning of changes", "req": "When you determine the need to change the system, carry the change out in a planned manner, considering its purpose and potential consequences, the impact on the integrity of the system, availability of resources and information, allocation of responsibilities and authorities, communication of the change, how its effectiveness will be monitored and evaluated, and how its results will be reviewed.", "ex": "Al-Ufuq Electrical moved from paper archiving to an electronic document system. The change plan covered purpose, impact on document control, resources, appointment of a system administrator, communication and training, an indicator for document retrieval time, and a review after three months.", "how": ["Use a change request form covering the seven considerations.", "Assess the impact on procedures and authorities before approval.", "Plan communication and training.", "Run a post-implementation review and record the lessons."], "ev": ["Change request and change plan forms", "Impact assessment", "Post-implementation review"], "tip": "Guidance on organizational change management is available in ISO/TS 10020."}}]}, {"id": "7", "phase": "do", "illo": "support", "ar": {"title": "الدعم", "short": "الدعم", "intro": "لا يعمل النظام بدون موارد: أفراد أكفاء، وبنية تحتية، وبيئة عمل مناسبة، وأجهزة قياس موثوقة، ومعرفة، وتواصل، ووثائق مضبوطة."}, "en": {"title": "Support", "short": "Support", "intro": "The system does not run without resources: competent people, infrastructure, a suitable working environment, reliable measuring equipment, knowledge, communication and controlled documents."}, "subs": [{"n": "7.1.1", "s": "", "ar": {"t": "الموارد: عام", "req": "حدِّد الموارد اللازمة لإنشاء النظام وتطبيقه والحفاظ عليه وتحسينه، ووفرها، مع مراعاة قدرات الموارد الداخلية وقيودها وما يلزم الحصول عليه من الخارج.", "ex": "قررت شركة الأفق إسناد اختبارات أنظمة الوقاية لمختبر خارجي متخصص، لعدم توفر فريق داخلي مؤهل.", "how": ["مراجعة الموارد في بداية كل مشروع.", "قرار موثق لما يُنفذ داخلياً وما يُسند.", "ربط الإسناد بضوابط البند 8.4."], "ev": ["خطط الموارد", "قرارات الإسناد"], "tip": ""}, "en": {"t": "Resources: general", "req": "Determine and provide the resources needed to establish, implement, maintain and continually improve the system, considering the capabilities and constraints of internal resources and what needs to be obtained externally.", "ex": "Al-Ufuq Electrical decided to outsource protection system testing to a specialist laboratory because it has no qualified in-house team.", "how": ["Review resources at the start of every project.", "Record the make-or-outsource decision.", "Link outsourcing to the controls in 8.4."], "ev": ["Resource plans", "Outsourcing decisions"], "tip": ""}}, {"n": "7.1.2", "s": "", "ar": {"t": "الأفراد", "req": "حدِّد الأفراد اللازمين لتطبيق النظام وتشغيل العمليات وضبطها، ووفرهم.", "ex": "لكل مشروع لدى شركة الأفق خطة قوى عاملة تحدد عدد المهندسين والمشرفين والفنيين حسب مراحل التنفيذ.", "how": ["خطة قوى عاملة لكل مشروع.", "مقارنة المتاح بالمطلوب.", "خطة توظيف أو تعاقد لسد النقص."], "ev": ["خطة القوى العاملة", "الهيكل الوظيفي للمشروع"], "tip": ""}, "en": {"t": "People", "req": "Determine and provide the people necessary for effective implementation of the system and for the operation and control of its processes.", "ex": "Every Al-Ufuq Electrical project has a manpower plan setting out engineers, supervisors and technicians by construction phase.", "how": ["Prepare a manpower plan per project.", "Compare available against required.", "Plan recruitment or subcontracting to close the gap."], "ev": ["Manpower plan", "Project organization chart"], "tip": ""}}, {"n": "7.1.3", "s": "upd", "ar": {"t": "البنية التحتية", "req": "حدِّد البنية التحتية اللازمة ووفرها وحافظ عليها: المباني والمرافق، المعدات والأجهزة والبرمجيات، وسائل النقل، تقنية المعلومات والاتصالات، ولكل أنماط العمل (في الموقع، عن بُعد، أو هجين).", "ex": "لدى شركة الأفق سجل للمعدات (رافعات، ماكينات سحب الكابلات) مع صيانة وقائية، ونظام ERP، وأجهزة لوحية لفرق المواقع، وصلاحيات آمنة للعمل عن بُعد.", "how": ["سجل أصول شامل.", "خطة صيانة وقائية وسجلات الأعطال.", "ضوابط أنظمة المعلومات والعمل عن بُعد."], "ev": ["سجل الأصول", "خطط وسجلات الصيانة"], "tip": ""}, "en": {"t": "Infrastructure", "req": "Determine, provide and maintain the infrastructure needed: buildings and utilities, equipment including hardware and software, transport, and information and communication technology, for all modes of work including on-site, remote and hybrid.", "ex": "Al-Ufuq Electrical keeps an equipment register (cranes, cable pulling winches) with preventive maintenance, an ERP system, tablets for site crews and secure remote access.", "how": ["Maintain a complete asset register.", "Run a preventive maintenance plan and breakdown records.", "Control IT systems and remote working."], "ev": ["Asset register", "Maintenance plans and records"], "tip": ""}}, {"n": "7.1.4", "s": "upd", "ar": {"t": "بيئة تشغيل العمليات", "req": "حدِّد بيئة العمل اللازمة ووفرها وحافظ عليها. تشمل عوامل اجتماعية (عدم التمييز، الهدوء)، ونفسية (تقليل الضغوط، الوقاية من الاحتراق الوظيفي، الحماية العاطفية)، ومادية (حرارة، رطوبة، إضاءة، تهوية، نظافة، ضوضاء). وبعض هذه العوامل تتأثر بثقافة الجودة والسلوك الأخلاقي.", "ex": "وفرت شركة الأفق استراحات مكيفة في المواقع، ونقلت ساعات العمل بعيداً عن ذروة الحر صيفاً، وتتابع ساعات العمل الإضافية للحد من الإرهاق، ولديها سياسة لمنع التمييز والتنمر.", "how": ["تحديد العوامل المؤثرة على جودة العمل في كل موقع.", "قياسها: استبيانات، قياسات حرارة وإضاءة.", "إجراءات تحسين ومتابعة."], "ev": ["استبيانات بيئة العمل", "القياسات البيئية", "السياسات ذات الصلة"], "tip": ""}, "en": {"t": "Environment for the operation of processes", "req": "Determine, provide and maintain the environment needed for the operation of processes. It covers social factors (non-discriminatory, calm), psychological factors (stress reduction, burnout prevention, emotional protection) and physical factors (temperature, humidity, light, airflow, hygiene, noise). Some of these are influenced by the organization's quality culture and ethical behaviour.", "ex": "Al-Ufuq Electrical provides air-conditioned rest shelters on site, shifts working hours away from peak summer heat, monitors overtime to limit fatigue, and maintains a policy against discrimination and harassment.", "how": ["Identify the factors that affect work quality at each site.", "Measure them: surveys, temperature and lighting readings.", "Take improvement actions and follow up."], "ev": ["Work environment surveys", "Environmental measurements", "Related policies"], "tip": ""}}, {"n": "7.1.5.1", "s": "", "ar": {"t": "موارد الرصد والقياس", "req": "حدِّد موارد الرصد والقياس ووفرها بحيث تعطي نتائج صحيحة وموثوقة، وتكون ملائمة لنوع النشاط ومصانة، مع دليل موثق على صلاحيتها.", "ex": "تستخدم شركة الأفق أجهزة قياس مقاومة العزل ومفاتيح العزم، مع فحص يومي قبل الاستخدام.", "how": ["سجل لجميع أجهزة القياس.", "تحديد مدى الملاءمة لكل استخدام.", "صيانة وفحص دوري."], "ev": ["سجل الأجهزة", "سجلات الفحص"], "tip": ""}, "en": {"t": "Monitoring and measuring resources", "req": "Determine and provide the resources needed to ensure valid and reliable results, suitable for the type of activity and maintained to remain fit for purpose, with documented information as evidence of fitness for purpose.", "ex": "Al-Ufuq Electrical uses insulation resistance testers and torque wrenches, with a pre-use check every day.", "how": ["Keep a register of all measuring devices.", "Confirm suitability for each use.", "Maintain and inspect them periodically."], "ev": ["Equipment register", "Inspection records"], "tip": ""}}, {"n": "7.1.5.2", "s": "", "ar": {"t": "إمكانية تتبع نتائج القياس", "req": "عند اشتراط التتبع: تُعاير الأجهزة أو يُتحقق منها على فترات محددة أو قبل الاستخدام مقابل معايير دولية أو وطنية (أو يُوثَّق الأساس البديل)، وتُعرَّف حالتها، وتُحمى من العبث والتلف. وعند اكتشاف عدم صلاحية جهاز، قيّم أثر ذلك على النتائج السابقة واتخذ الإجراء.", "ex": "اكتشفت شركة الأفق أن جهاز قياس العزل خارج الحدود في المعايرة السنوية، فراجعت كل الاختبارات التي أُجريت به منذ آخر معايرة، وأعادت اختبار الدوائر الحرجة.", "how": ["جدول معايرة لدى مختبر معتمد.", "ملصق حالة المعايرة على كل جهاز.", "إجراء لتقييم الأثر عند فشل جهاز."], "ev": ["شهادات المعايرة", "ملصقات الحالة", "سجل تقييم الأثر"], "tip": ""}, "en": {"t": "Measurement traceability", "req": "Where traceability is required, measuring equipment is calibrated or verified at specified intervals or before use against international or national standards (or the basis used is documented), identified to show its status, and safeguarded from adjustment, damage or deterioration. When equipment is found unfit, assess the validity of previous results and take action.", "ex": "Al-Ufuq Electrical found an insulation tester out of tolerance at annual calibration, reviewed every test performed with it since the last calibration and re-tested the critical circuits.", "how": ["Maintain a calibration schedule with an accredited laboratory.", "Put a calibration status label on every device.", "Have a procedure for assessing impact when a device fails."], "ev": ["Calibration certificates", "Status labels", "Impact assessment records"], "tip": ""}}, {"n": "7.1.6", "s": "upd", "ar": {"t": "المعرفة التنظيمية", "req": "حدِّد المعرفة اللازمة للعمليات وتحقيق النتائج، واحتفظ بها وطبّقها وشاركها. وعند التعامل مع التغيرات، راجع معرفتك الحالية وحدِّد كيف تكتسب المعرفة الإضافية. المعرفة قد تكون خبرة لدى الأفراد، أو تعلماً، أو مضمنة في الطرق، أو محفوظة في أنظمة رقمية.", "ex": "تعقد شركة الأفق جلسة دروس مستفادة بعد كل مشروع، ولديها مكتبة رقمية للمخططات النموذجية، وخطة لنقل خبرة كبير المهندسين قبل تقاعده.", "how": ["حصر المعرفة الحرجة ومن يملكها.", "توثيقها ومشاركتها (مكتبة، إرشاد).", "خطط إحلال للخبرات النادرة."], "ev": ["سجل الدروس المستفادة", "المكتبة المعرفية", "خطط الإحلال"], "tip": ""}, "en": {"t": "Organizational knowledge", "req": "Determine the knowledge needed to operate the processes and achieve intended results, then retain, apply and share it. When addressing changing needs and trends, review current knowledge and determine how to acquire what is missing. Knowledge may be experience held by people, learning, knowledge embedded in methods, or knowledge held in digital systems.", "ex": "Al-Ufuq Electrical holds a lessons-learned session after every project, keeps a digital library of standard drawings, and has a plan to transfer the chief engineer's knowledge before he retires.", "how": ["Identify critical knowledge and who holds it.", "Document and share it (library, mentoring).", "Prepare succession plans for scarce expertise."], "ev": ["Lessons learned log", "Knowledge library", "Succession plans"], "tip": ""}}, {"n": "7.2", "s": "", "ar": {"t": "الكفاءة", "req": "حدِّد الكفاءة المطلوبة لمن يعملون تحت سيطرتك، وتأكد من توافرها عبر التعليم أو التدريب أو الخبرة، واتخذ إجراءات لسد الفجوات وقيّم فعاليتها، مع دليل موثق.", "ex": "مصفوفة الكفاءة لدى شركة الأفق تشترط شهادة المصنّع لفني وصلات الجهد العالي. الفني الجديد يُدرَّب ثم يُقيَّم عملياً قبل العمل المستقل.", "how": ["مصفوفة كفاءة لكل وظيفة مؤثرة.", "تقييم الفجوات.", "تدريب أو إرشاد أو إعادة تكليف أو تعيين.", "تقييم فعالية الإجراء."], "ev": ["مصفوفة الكفاءات", "سجلات التدريب", "تقييم الفعالية", "الشهادات"], "tip": ""}, "en": {"t": "Competence", "req": "Determine the competence needed by persons working under your control, ensure they are competent on the basis of education, training or experience, take action to close gaps and evaluate its effectiveness, and keep documented evidence of competence.", "ex": "Al-Ufuq Electrical's competence matrix requires a manufacturer certificate for high-voltage jointers. A new technician is trained and then assessed practically before working unsupervised.", "how": ["Build a competence matrix for every role that affects quality.", "Assess the gaps.", "Train, mentor, reassign or hire.", "Evaluate whether the action worked."], "ev": ["Competence matrix", "Training records", "Effectiveness evaluation", "Certificates"], "tip": ""}}, {"n": "7.3", "s": "new", "ar": {"t": "الوعي", "req": "تأكد أن الأفراد يدركون: سياسة الجودة، وإسهامهم في فعالية النظام وفوائد تحسين الأداء، وعواقب عدم الالتزام، والأهداف ذات الصلة، وثقافة الجودة والسلوك الأخلاقي في المنظمة.", "ex": "في لقاء التوعية الشهري بمواقع شركة الأفق يُعرض مثال حقيقي لعمل رُفض وتكلفة إعادته، ويُؤكد مبدأ الإبلاغ عن الخطأ دون خوف.", "how": ["برنامج توعية دوري بلغات العاملين.", "إدراج الثقافة والأخلاقيات في التعريف بالوظيفة.", "التحقق من الوعي بالحوار الميداني."], "ev": ["سجلات التوعية", "مقابلات الموظفين"], "tip": "سؤال متوقع من المدقق لأي فني: ماذا تفعل لو اكتشفت خطأ في عملك؟"}, "en": {"t": "Awareness", "req": "Ensure that people are aware of the quality policy, their contribution to the effectiveness of the system and the benefits of improved performance, the implications of not conforming, relevant quality objectives, and the organization's quality culture and ethical behaviour.", "ex": "At Al-Ufuq Electrical's monthly site awareness session, a real case of rejected work and its rework cost is presented, and the principle of reporting errors without fear is reinforced.", "how": ["Run a recurring awareness programme in the languages of the workforce.", "Include culture and ethics in job induction.", "Verify awareness through conversations on site."], "ev": ["Awareness records", "Employee interviews"], "tip": "A question any technician should expect from the auditor: what do you do if you find an error in your own work?"}}, {"n": "7.4", "s": "", "ar": {"t": "التواصل", "req": "حدِّد الاتصالات الداخلية والخارجية المتعلقة بالنظام: ماذا يُبلَّغ، ومتى، ولمن، وكيف، ومن يتولى ذلك.", "ex": "مصفوفة التواصل لدى شركة الأفق: تقرير أسبوعي للعميل من مدير المشروع، تعاميم داخلية من إدارة الجودة، ومحاضر اجتماعات تنسيق يومية في الموقع.", "how": ["مصفوفة اتصال بالأسئلة الخمسة.", "قنوات رسمية موثقة.", "مراجعة فعالية التواصل."], "ev": ["مصفوفة الاتصال", "محاضر وتعاميم"], "tip": ""}, "en": {"t": "Communication", "req": "Determine the internal and external communications relevant to the system: on what, when, with whom, how, and who communicates.", "ex": "Al-Ufuq Electrical's communication matrix: a weekly client report from the project manager, internal circulars from the quality department, and minutes of daily site coordination meetings.", "how": ["Build a communication matrix around the five questions.", "Use documented, formal channels.", "Review whether the communication works."], "ev": ["Communication matrix", "Minutes and circulars"], "tip": ""}}, {"n": "7.5.1", "s": "", "ar": {"t": "المعلومات الموثقة: عام", "req": "يتضمن النظام المعلومات الموثقة التي تطلبها المواصفة، وما تراه المنظمة لازماً لفعاليته. ويختلف حجم التوثيق حسب حجم المنظمة ونشاطها وتعقيد عملياتها وكفاءة أفرادها.", "ex": "ورشة صغيرة تكتفي بإجراءات مختصرة، بينما تحتاج شركة الأفق بمشاريعها المتعددة إلى دليل وإجراءات وتعليمات عمل ونماذج.", "how": ["قائمة بالمعلومات الموثقة المطلوبة من المواصفة.", "إضافة ما تحتاجه العمليات فعلياً."], "ev": ["القائمة الرئيسية للوثائق"], "tip": ""}, "en": {"t": "Documented information: general", "req": "The system includes the documented information required by the standard plus whatever the organization determines is necessary for effectiveness. The extent differs with the size of the organization, its activities, the complexity of its processes and the competence of its people.", "ex": "A small workshop may need only short procedures, while Al-Ufuq Electrical, with multiple concurrent projects, needs a manual, procedures, work instructions and forms.", "how": ["List the documented information the standard requires.", "Add what the processes genuinely need."], "ev": ["Master document list"], "tip": ""}}, {"n": "7.5.2", "s": "", "ar": {"t": "إنشاء المعلومات الموثقة وتحديثها", "req": "عند الإنشاء والتحديث: تعريف مناسب (عنوان، تاريخ، معد، رقم مرجعي)، وتنسيق ووسيط مناسبان، ومراجعة واعتماد.", "ex": "ترميز الوثائق لدى شركة الأفق مثل QP-PUR-01 Rev.2، مع التاريخ والمعد والمراجع والمعتمد.", "how": ["نظام ترميز موحد.", "قالب موحد للوثائق.", "مسار مراجعة واعتماد."], "ev": ["ترويسة الوثائق", "سجل الاعتمادات"], "tip": ""}, "en": {"t": "Creating and updating documented information", "req": "When creating and updating, ensure appropriate identification and description (title, date, author, reference number), appropriate format and media, and review and approval for suitability and adequacy.", "ex": "Al-Ufuq Electrical codes documents as QP-PUR-01 Rev.2, with date, author, reviewer and approver.", "how": ["Use one coding system.", "Use a standard document template.", "Define a review and approval route."], "ev": ["Document headers", "Approval records"], "tip": ""}}, {"n": "7.5.3", "s": "", "ar": {"t": "ضبط المعلومات الموثقة", "req": "اضبط المعلومات الموثقة لتكون متاحة عند الحاجة ومحمية. عالج: التوزيع والوصول، الحفظ والمقروئية، ضبط التغييرات والإصدارات، الاحتفاظ والإتلاف. عرِّف الوثائق الخارجية المهمة واضبطها، واحمِ أدلة المطابقة من التعديل غير المقصود.", "ex": "نظام وثائق إلكتروني لدى شركة الأفق بصلاحيات حسب الدور، ومواصفات العميل مسجلة كوثائق خارجية بإصداراتها، والوثائق الملغاة معلّمة، وسجلات الاختبار محفوظة بصيغة غير قابلة للتعديل.", "how": ["صلاحيات وصول حسب الدور.", "سجل الإصدارات والوثائق الخارجية.", "جدول الاحتفاظ والإتلاف.", "حماية السجلات من التعديل."], "ev": ["نظام إدارة الوثائق", "سجل الوثائق الخارجية", "جدول الاحتفاظ"], "tip": ""}, "en": {"t": "Control of documented information", "req": "Control documented information so that it is available where and when needed and adequately protected. Address distribution and access, storage and preservation including legibility, change and version control, and retention and disposition. Identify and control documents of external origin, and protect evidence of conformity from unintended alteration.", "ex": "Al-Ufuq Electrical runs an electronic document system with role-based access, registers client specifications as external documents with their revisions, marks superseded documents, and stores test records in a non-editable format.", "how": ["Set role-based access rights.", "Keep a revision log and an external document register.", "Define a retention and disposal schedule.", "Protect records from alteration."], "ev": ["Document management system", "External document register", "Retention schedule"], "tip": ""}}]}, {"id": "8", "phase": "do", "illo": "operation", "ar": {"title": "التشغيل", "short": "التشغيل", "intro": "قلب النظام: من فهم متطلبات العميل، إلى التصميم، وضبط الموردين، والتنفيذ، والإفراج، ومعالجة ما لا يطابق."}, "en": {"title": "Operation", "short": "Operation", "intro": "The heart of the system: from understanding customer requirements to design, supplier control, execution, release, and handling of what does not conform."}, "subs": [{"n": "8.1", "s": "", "ar": {"t": "التخطيط والضبط التشغيلي", "req": "خطّط العمليات التشغيلية ونفّذها واضبطها، وكذلك الإجراءات المحددة في البند 6، عبر: تحديد المتطلبات، ووضع معايير قبول المنتجات ومعايير العمليات، والضبط وفق هذه المعايير، وتحديد الموارد. اضبط التغييرات المخططة وراجع عواقب غير المقصودة، واضبط كل ما يُورَّد خارجياً، ووفّر أدلة موثقة.", "ex": "لكل مشروع لدى شركة الأفق خطة جودة (PQP) وخطة فحص واختبار (ITP) تحدد معايير القبول ونقاط الوقوف لكل نشاط.", "how": ["خطة جودة للمشروع.", "خطة فحص واختبار بمعايير القبول.", "دمج إجراءات المخاطر في الخطط."], "ev": ["خطط الجودة", "خطط الفحص والاختبار"], "tip": ""}, "en": {"t": "Operational planning and control", "req": "Plan, implement and control the processes needed to meet product and service requirements and to implement the actions determined in Clause 6: determine the requirements, set acceptance criteria for products and criteria for the processes, control the processes to those criteria, and determine the resources. Control planned changes, review the consequences of unintended ones, control what is provided externally, and keep documented evidence.", "ex": "Every Al-Ufuq Electrical project has a project quality plan and an inspection and test plan that set acceptance criteria and hold points for each activity.", "how": ["Issue a project quality plan.", "Issue an inspection and test plan with acceptance criteria.", "Embed the risk actions in these plans."], "ev": ["Quality plans", "Inspection and test plans"], "tip": ""}}, {"n": "8.2.1", "s": "upd", "ar": {"t": "التواصل مع العملاء", "req": "يشمل التواصل مع العملاء: معلومات المنتجات والخدمات، والاستفسارات والعقود والطلبات وتعديلاتها، والتغذية الراجعة والشكاوى، والتعامل مع ممتلكاتهم، ومعلومات إجراءات الطوارئ بما فيها حالات تعطل التوريد.", "ex": "عند تأخر شحنة محولات، أبلغت شركة الأفق العميل مسبقاً بالخطة البديلة والجدول المعدّل.", "how": ["قنوات رسمية للتواصل.", "سجل الشكاوى والملاحظات.", "خطة تواصل عند الاضطرابات."], "ev": ["سجل التواصل", "سجل الشكاوى", "خطط التواصل عند الأزمات"], "tip": ""}, "en": {"t": "Customer communication", "req": "Communication with customers covers product and service information, enquiries, contracts and orders including changes, feedback and complaints, handling customer property, and information on contingency actions, including disruptions to the supply of products or services.", "ex": "When a transformer shipment was delayed, Al-Ufuq Electrical informed the client in advance of the fallback plan and the revised schedule.", "how": ["Use formal communication channels.", "Keep a complaints and feedback log.", "Have a communication plan for disruptions."], "ev": ["Communication log", "Complaints log", "Crisis communication plans"], "tip": ""}}, {"n": "8.2.2", "s": "", "ar": {"t": "تحديد متطلبات المنتجات والخدمات", "req": "تأكد من تعريف متطلبات المنتجات والخدمات (بما فيها التشريعية وما تراه المنظمة ضرورياً) ومن قدرتك على الوفاء بما تدّعيه.", "ex": "قبل ذكر خبرة في مشاريع الجهد الفائق في عروضها، تتحقق شركة الأفق من وجود مشاريع منجزة مثبتة.", "how": ["قائمة متطلبات لكل منتج أو خدمة.", "مراجعة المواد التسويقية والعروض."], "ev": ["المواصفات", "مراجعة العروض"], "tip": ""}, "en": {"t": "Determining requirements for products and services", "req": "Ensure the requirements are defined, including applicable statutory and regulatory requirements and those the organization considers necessary, and that you can meet the claims you make.", "ex": "Before claiming extra-high-voltage experience in a proposal, Al-Ufuq Electrical verifies it has completed projects to prove it.", "how": ["Keep a requirements list per product or service.", "Review marketing material and proposals."], "ev": ["Specifications", "Proposal reviews"], "tip": ""}}, {"n": "8.2.3", "s": "", "ar": {"t": "مراجعة المتطلبات", "req": "قبل الالتزام، راجع: متطلبات العميل (بما فيها التسليم وما بعده)، والمتطلبات الضمنية للاستخدام المقصود، ومتطلبات المنظمة، والتشريعات، واختلافات العقد عن العرض. حُلّ أي اختلاف، وأكّد المتطلبات غير الموثقة قبل القبول، ووثّق النتائج.", "ex": "نموذج مراجعة المناقصة لدى شركة الأفق يغطي: النطاق، المدة، المواصفات، الضمان، التشريعات، والقدرة الفنية والمالية، ويوقعه المعنيون قبل التقديم.", "how": ["نموذج مراجعة شامل.", "اجتماع مراجعة متعدد الإدارات.", "حل الاختلافات قبل التوقيع."], "ev": ["محاضر مراجعة العروض والعقود"], "tip": ""}, "en": {"t": "Review of requirements", "req": "Before committing to supply, review the customer's requirements including delivery and post-delivery, requirements not stated but necessary for the intended use, requirements specified by the organization, statutory and regulatory requirements, and any contract terms differing from those previously expressed. Resolve differences, confirm undocumented requirements before acceptance, and retain the results.", "ex": "Al-Ufuq Electrical's tender review form covers scope, duration, specifications, warranty, regulations and technical and financial capacity, and is signed by the functions involved before submission.", "how": ["Use a comprehensive review form.", "Hold a cross-functional review meeting.", "Resolve differences before signature."], "ev": ["Proposal and contract review records"], "tip": ""}}, {"n": "8.2.4", "s": "upd", "ar": {"t": "تغيير المتطلبات", "req": "عند تغيير المتطلبات، حدِّث المعلومات الموثقة وأبلغ الأطراف المعنية ذات الصلة.", "ex": "بعد أمر تغيير من العميل، حدّثت شركة الأفق المخططات وأبلغت المورد والمقاول الباطن.", "how": ["سجل أوامر التغيير.", "تحديث الوثائق.", "إبلاغ كل الأطراف المتأثرة."], "ev": ["سجل التغييرات", "إشعارات الإبلاغ"], "tip": ""}, "en": {"t": "Changes to requirements", "req": "When requirements change, update the relevant documented information and communicate the change to the relevant interested parties.", "ex": "After a client variation order, Al-Ufuq Electrical updated the drawings and notified both the supplier and the subcontractor.", "how": ["Keep a variation order log.", "Update the documents.", "Notify every affected party."], "ev": ["Change log", "Notification records"], "tip": ""}}, {"n": "8.3.1", "s": "upd", "ar": {"t": "التصميم والتطوير: عام", "req": "أنشئ عملية تصميم وتطوير مناسبة لضمان التوريد اللاحق. ويمكن أن تكون تكرارية تشمل المراجعة والتحقق والمصادقة والتغذية الراجعة.", "ex": "تصميم المحطات لدى شركة الأفق يمر بمراحل 30% ثم 60% ثم 90% ثم الإصدار للتنفيذ.", "how": ["إجراء تصميم بمراحل واضحة."], "ev": ["إجراء التصميم"], "tip": ""}, "en": {"t": "Design and development: general", "req": "Establish, implement and maintain a design and development process appropriate to ensure the subsequent provision of products and services. It may be iterative, with cycles of review, verification, validation and feedback.", "ex": "Substation design at Al-Ufuq Electrical runs through 30%, 60% and 90% stages before issue for construction.", "how": ["Establish a design procedure with clear stages."], "ev": ["Design procedure"], "tip": ""}}, {"n": "8.3.2", "s": "", "ar": {"t": "تخطيط التصميم", "req": "راعِ: طبيعة التصميم ومدته وتعقيده، المراحل والمراجعات، التحقق والمصادقة، المسؤوليات، الموارد، الواجهات بين المشاركين، مشاركة العملاء، متطلبات التوريد اللاحق، مستوى الضبط المتوقع، والأدلة اللازمة.", "ex": "خطة التصميم لدى شركة الأفق تحدد مراجعة عند كل مرحلة، واعتماد الاستشاري، والتنسيق بين التخصصات الكهربائية والمدنية.", "how": ["خطة تصميم بجدول زمني.", "مصفوفة مسؤوليات للتخصصات."], "ev": ["خطة التصميم"], "tip": ""}, "en": {"t": "Design and development planning", "req": "Consider the nature, duration and complexity of the activities, the required stages and reviews, verification and validation activities, responsibilities and authorities, internal and external resources, interfaces between the people involved, involvement of customers, requirements for subsequent provision, the level of control expected, and the documented information needed.", "ex": "Al-Ufuq Electrical's design plan defines a review at each stage, consultant approval, and coordination between the electrical and civil disciplines.", "how": ["Issue a design plan with a schedule.", "Build a responsibility matrix across disciplines."], "ev": ["Design plan"], "tip": ""}}, {"n": "8.3.3", "s": "upd", "ar": {"t": "مدخلات التصميم", "req": "حدِّد المدخلات الأساسية مع مراعاة: المتطلبات الوظيفية والأدائية، والخبرات السابقة، والتشريعات، والمعايير والأكواد، وعواقب الفشل. يجب أن تكون كاملة وواضحة، وأن تُحل تعارضاتها وتوثَّق. وقد تتطور مع تقدم التصميم.", "ex": "مدخلات تصميم محطة لدى شركة الأفق: مواصفات العميل، معايير IEC، دراسة التربة، ودروس مشروع سابق.", "how": ["سجل مدخلات التصميم.", "مراجعة الاكتمال وحل التعارض."], "ev": ["سجل المدخلات"], "tip": ""}, "en": {"t": "Design and development inputs", "req": "Determine the requirements essential for the specific design, considering functional and performance requirements, information from previous similar activities, statutory and regulatory requirements, standards or codes of practice you have committed to, and the potential consequences of failure. Inputs must be complete, unambiguous and adequate, conflicts resolved, and retained as documented information. They may evolve as the design progresses.", "ex": "Design inputs for a Al-Ufuq Electrical substation: client specifications, IEC standards, the soil investigation report and lessons from a previous project.", "how": ["Keep a design input register.", "Review completeness and resolve conflicts."], "ev": ["Design input records"], "tip": ""}}, {"n": "8.3.4", "s": "", "ar": {"t": "ضوابط التصميم", "req": "طبّق ضوابط تضمن: تحديد النتائج، وإجراء المراجعات، والتحقق (المخرجات تلبي المدخلات)، والمصادقة (المنتج يلبي الاستخدام المقصود)، ومعالجة المشكلات، وتوثيق ذلك.", "ex": "مراجعة متعددة التخصصات، ثم تحقق بحسابات مستقلة، ثم مصادقة باختبارات التشغيل عند شركة الأفق.", "how": ["مراجعات مجدولة.", "تحقق مستقل.", "مصادقة قبل التسليم."], "ev": ["محاضر المراجعة", "تقارير التحقق والمصادقة"], "tip": ""}, "en": {"t": "Design and development controls", "req": "Apply controls to ensure the results to be achieved are defined, reviews are conducted, verification confirms outputs meet input requirements, validation confirms the product meets the requirements for its intended use, necessary actions are taken on problems found, and documented information is retained.", "ex": "At Al-Ufuq Electrical: a multi-discipline review, then verification through independent calculations, then validation through commissioning tests.", "how": ["Schedule the reviews.", "Use independent verification.", "Validate before handover."], "ev": ["Review minutes", "Verification and validation reports"], "tip": ""}}, {"n": "8.3.5", "s": "", "ar": {"t": "مخرجات التصميم", "req": "تأكد أن المخرجات تلبي المدخلات، وكافية للعمليات اللاحقة، وتتضمن متطلبات الرصد ومعايير القبول، وتحدد الخصائص الأساسية للاستخدام الآمن والسليم. ووثّقها.", "ex": "مخرجات شركة الأفق: مخططات معتمدة للتنفيذ، وقوائم مواد، ومعايير اختبار.", "how": ["قائمة مخرجات لكل مرحلة.", "اعتماد قبل الإصدار."], "ev": ["المخططات والمواصفات المعتمدة"], "tip": ""}, "en": {"t": "Design and development outputs", "req": "Ensure outputs meet the input requirements, are adequate for subsequent processes, include or reference monitoring and measuring requirements and acceptance criteria, and specify the characteristics essential for the intended purpose, including safe and proper provision. Retain them as documented information.", "ex": "Al-Ufuq Electrical's outputs: issued-for-construction drawings, bills of materials and test criteria.", "how": ["List the outputs due at each stage.", "Approve before issue."], "ev": ["Approved drawings and specifications"], "tip": ""}}, {"n": "8.3.6", "s": "", "ar": {"t": "تغييرات التصميم", "req": "حدِّد تغييرات التصميم وراجعها واضبطها لمنع الأثر السلبي، ووثّق: التغيير، ونتائج المراجعة، والاعتماد، والإجراءات الوقائية.", "ex": "اكتُشف عائق تحت الأرض، فعدّلت شركة الأفق مسار الكابل بطلب تغيير تصميم معتمد.", "how": ["سجل تغييرات التصميم.", "مراجعة الأثر.", "اعتماد قبل التنفيذ."], "ev": ["سجل تغييرات التصميم"], "tip": ""}, "en": {"t": "Design and development changes", "req": "Identify, review and control changes made during or after design, to the extent necessary to ensure no adverse impact on conformity. Retain documented information on the changes, the review results, the authorization, and the actions taken to prevent adverse impacts.", "ex": "After an underground obstruction was found, Al-Ufuq Electrical rerouted the cable
